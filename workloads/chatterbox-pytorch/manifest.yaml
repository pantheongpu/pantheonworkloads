name: chatterbox-pytorch
description: "Chatterbox (Resemble AI) (tts) on a fixed input; the result is compared with a tolerance."
kind: functional
runtime: pytorch
targets: [gpu]
compare: tolerance
tolerance:
  abs: 0.03
  rel: 0.0
  fields:
    duration_s: {abs: 0.5, rel: 0.0}
timeout_s: 3635
requires:
  gpus: 1
  gpu_memory_gb: 10
  notes: "weights 3.0 GiB; 3.0/1*1.1 + 4 = 7.3 GiB per GPU; smallest class holding it at 98% usable: 10 GiB; 1 x 10"
model:
  id: "ResembleAI/chatterbox (tts; 4 pinned weights file(s), as stored)"
  revision: "5bb1f6ee58e50c3b8d408bc82a6d3740c2db6e18 (HF commit); the weights files are pinned by sha256 in model.sha256 and verified on every run"
  licence: "MIT"
  source_url: https://huggingface.co/ResembleAI/chatterbox
notes: "VERIFIED ON NVIDIA A10G (model catalog, stage 2a, 2026-10-10): first real run. Reference recorded with `bin/pw record --target gpu` on NVIDIA A10G (one on-demand g5.2xlarge, 22 GiB, driver 595.91.07, Ubuntu 22.04) and identical in 3 further consecutive runs. Software: torch 2.6.0, transformers 5.2.0, diffusers 0.29.0, numpy 1.26.4. Own venv (PW_VENV_NAME=chatterbox, PW_TORCH_ANY_CUDA=1): chatterbox-tts 0.1.7 pins torch 2.6.0 (its cu124 wheel ran fine on the A10G with driver 595), numpy 1.26.4, transformers 5.2.0 and safetensors 0.5.3, so it cannot share the stack. Needs setuptools==80.10.2: resemble-perth imports pkg_resources, which setuptools 81 and later removed, and without it perth.PerthImplicitWatermarker is None ('TypeError: NoneType object is not callable'). The clip is 2.24 s of audio; the sampling is seeded and the result was identical in all 4 runs. DURATION (2026-10-30, A10G): duration_s was reported rounded to 0.5 s (2.24 s of audio gave 2.0), so a different stack could flip it; it is now the duration in seconds to 2 decimals, compared with abs 0.5 (rms keeps abs 0.03). Measured: 5 consecutive runs with seed 0 all 2.24 s (rms 0.144), TF32 on also 2.24 s, so the same stack is exact. Chatterbox's length is decided by when the sampler emits end-of-speech, so another stack that shifts the sampling is like another seed: seeds 1 to 24 (PW_TTS_SEED knob, default 0) gave 2.20 to 2.60 s (mean 2.40), worst deviation from the reference 0.36 s (seed 5, 2.60 s); 0.5 s is the smallest round value above that with a margin of 0.14 s. The bound is wide on purpose and still rejects a clip below 1.74 s or above 2.74 s. Not changed, but seen: seed 13 gives rms 0.110, 0.034 from the reference, outside the unchanged rms bound of 0.03, so another stack could trip the RMS check before the duration one. No CPU target exists for this workload. Provenance, written from Hub metadata on 2026-10-09 before this run: What was read (2026-10-09, public Hugging Face API and raw files, no credentials): commit, file names, sizes and LFS sha256 of the 4 pinned file(s) (model.sha256, Hub oids, verified on every run). Licence: MIT. Read 2026-10-09 from the Hub without credentials: ResembleAI/chatterbox@5bb1f6ee; card license: mit. Hardware: requires 1 x 10 GiB (single node); weights 3.0 GiB; 3.0/1*1.1 + 4 = 7.3 GiB per GPU; smallest class holding it at 98% usable: 10 GiB; 1 x 10. These margins were assumptions; this workload ran within them on one 22.5 GiB A10G. Task: synthesise one fixed sentence; the waveform is checked (finite, 1 s or longer, not silent), output = duration in seconds (2 decimals, abs tolerance 0.5) and the RMS level (abs tolerance 0.03). The generator is sampled, so this is a plausibility check, not a regression test of the audio."
