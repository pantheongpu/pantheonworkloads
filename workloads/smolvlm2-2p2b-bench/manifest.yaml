name: smolvlm2-2p2b-bench
description: 'SmolVLM2-2.2B-Instruct (fp16): decode tokens per second at batch 1, prefill images per second, peak GPU memory.'
kind: benchmark
runtime: pytorch
targets:
- gpu
timeout_s: 3600
model:
  id: HuggingFaceTB/SmolVLM2-2.2B-Instruct (AutoModelForImageTextToText, fp16; SigLIP vision tower + SmolLM2-1.7B language model, 2 safetensors shards, 9.0 GB on disk (fp32), loaded as fp16)
  revision: 482adb537c021c86670beed01cd58990d01e72e4 (HF commit); the safetensors shards and the image are pinned by sha256 in model.sha256 and verified on every run
  licence: Apache-2.0
  source_url: https://huggingface.co/HuggingFaceTB/SmolVLM2-2.2B-Instruct
notes: 'Image: scikit-image astronaut.png (NASA photo of Eileen Collins, public domain per scikit-image''s data docstring; scikit-image tag v0.22.0, commit 441fe68b, BSD-3-Clause repo), fetched at run time, sha256 pinned, never committed (same pin as blip2-opt-2p7b-pytorch and yolox-object-detection). Prompt: ''What is the person holding or standing next to? Answer in one sentence.'' (chat template, one image). Greedy (num_beams 1, repetition_penalty 1.0), fp16, up to 32 new tokens, torch 2.14.1+cu130 / transformers 5.19.0 on one NVIDIA A10G 24 GB (peak 5.0 GB allocated). Same script as smolvlm2-2p2b-pytorch in bench mode, after its own correctness checks. Metrics: decode_tokens_per_s_b1 (127 tokens after the first, from a forced 128-token generation minus a 1-token generation, median of 5 timed pairs after 2 warm-ups; batch 1, KV cache, SDPA attention), prefill_images_per_s_b1 (image + prompt through the vision tower and the language model, one token out, median of 5), peak_gpu_memory_gb (torch max allocated over the whole run). Model load and image preprocessing excluded. Real GPU only. Licence: read 2026-10-09: HuggingFaceTB/SmolVLM2-2.2B-Instruct @ 482adb53 card front matter says license: apache-2.0, the card''s model summary says ''License: Apache 2.0'' and its License section says the checkpoints are released under Apache 2.0; the repo has no LICENSE file and is not gated.'
