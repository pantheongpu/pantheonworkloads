name: wan22-ti2v-5b-diffusers
description: "Wan2.2-TI2V-5B (diffusers) on a fixed input; the result is compared with a tolerance."
kind: functional
runtime: pytorch
targets: [gpu]
compare: tolerance
tolerance:
  abs: 0.05
  rel: 0.0
timeout_s: 3790
requires:
  gpus: 1
  gpu_memory_gb: 40
  notes: "weights 15.9 GiB; max(9.3 largest component, 15.9/1) + 16 = 31.9 GiB per GPU; smallest class holding it at 98% usable: 40 GiB; 1 x 40"
model:
  id: "Wan-AI/Wan2.2-TI2V-5B-Diffusers (diffusers; 9 pinned weights file(s), stored fp32, loaded bf16)"
  revision: "b8fff7315c768468a5333511427288870b2e9635 (HF commit); the weights files are pinned by sha256 in model.sha256 and verified on every run"
  licence: "Apache-2.0"
  source_url: https://huggingface.co/Wan-AI/Wan2.2-TI2V-5B-Diffusers
notes: "VERIFIED ON NVIDIA L40S 48 GB (model catalog, stage 2a, Tier B; sm_89): reference recorded and identical in 3 further runs. Run on one AWS g6e.xlarge (NVIDIA L40S, driver 595.91.07, 2026-10-10) with torch 2.14.1+cu130, transformers 5.19.0, diffusers 0.41.0, bfloat16, whole model on the one card. Statistics-only output (channel mean and std, 8x8 block means, gradients, frame change) recorded with bin/pw record --target gpu, then compared (abs tolerance in the manifest, unchanged) in 3 further bin/pw run passes; the generated pixels were bit-identical between runs on this card, so the tolerance has still been measured only against itself. The informational pixel hash was d892c35c646fda3d in every run. Its third rerun ran out of memory because a llama.cpp job of the same session held 19 GiB of the card (a sharing artefact); a rerun at the end passed. Provenance of the pins, read before the run: What was read (2026-10-09, public Hugging Face API and raw files, no credentials): commit, file names, sizes and LFS sha256 of the 9 pinned file(s) (model.sha256, Hub oids, verified on every run). Licence: Apache-2.0. Read 2026-10-09 from the Hub without credentials: Wan-AI/Wan2.2-TI2V-5B-Diffusers@b8fff731; card license: apache-2.0. Hardware: requires 1 x 40 GiB (single node); weights 15.9 GiB; max(9.3 largest component, 15.9/1) + 16 = 31.9 GiB per GPU; smallest class holding it at 98% usable: 40 GiB; 1 x 40. The hardware margins are formula values; measured memory is stated above. Task: one video from a fixed prompt and seed (30 steps, guidance 5.0); the output is statistics (channel mean/std, 8x8 block means, gradients, frame-to-frame change), never pixels, with an abs tolerance that is a guess until two GPUs have been compared. Weights are loaded bf16; with more than one GPU diffusers' device_map=balanced places whole components, so the largest component must fit one GPU. Architecture WanPipeline is listed by the pinned runtime (diffusers 0.41.0 pipelines). Still not verified: other cards (the abs tolerance is still a guess for cross-card comparison), other torch/diffusers versions."
