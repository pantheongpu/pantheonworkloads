name: cogvideox15-5b-diffusers
description: "CogVideoX1.5-5B (diffusers) on a fixed input; the result is compared with a tolerance."
kind: functional
runtime: pytorch
targets: [gpu]
compare: tolerance
tolerance:
  abs: 0.05
  rel: 0.0
timeout_s: 3947
restricted: true
requires:
  gpus: 1
  gpu_memory_gb: 48
  notes: "weights 28.9 GiB; max(17.7 largest component, 28.9/1) + 16 = 44.9 GiB per GPU; smallest class holding it at 98% usable: 48 GiB; 1 x 48"
model:
  id: "zai-org/CogVideoX1.5-5B (diffusers; 8 pinned weights file(s), as stored)"
  revision: "fdc5267c90b5c06492985b966e43aae984e189e0 (HF commit); the weights files are pinned by sha256 in model.sha256 and verified on every run"
  licence: "custom licence (LICENSE file begins 'The CogVideoX License 1. Definitions “Licensor” means the Co')"
  source_url: https://huggingface.co/zai-org/CogVideoX1.5-5B
notes: "VERIFIED ON NVIDIA RTX PRO 6000 Blackwell Server Edition 96 GB (model catalog, stage 2b batch 1; sm_120): reference recorded and identical in 3 further runs. Run on one AWS g7e.2xlarge in us-west-2 (nvidia-smi name 'NVIDIA RTX PRO 6000 Blackwell Server Edition', 97887 MiB, 95.6 GiB as torch sees it, sm_120, driver 595.112.07, Ubuntu 22.04 Deep Learning Base OSS Nvidia Driver AMI, 2026-10-30) with torch 2.14.1+cu130 (CUDA 13.0), transformers 5.19.0, diffusers 0.41.0, numpy 2.5.3 (uv Python 3.12 venv, LD_LIBRARY_PATH unset). Statistics reference recorded with bin/pw record --target gpu, then compared in 3 further bin/pw run passes (every one PASS; the informational pixel hash was identical in every run). The twin cogvideox15-5b-bench holds the speed. Unverified: other cards and runtime builds. Measured: peak GPU memory 69.04 GB (torch.cuda.max_memory_allocated; 33 frames of 768x1360, 30 steps, one card, no tiling), 97.2 s per generation. That is MORE than the 48 GiB class `requires` declares (the registry formula, largest component + 16 GiB, gave 44.9 GiB): on a 48 GB card this run would run out of memory. `requires` is not changed here because tests/test_model_catalog.py pins it to the registry arithmetic; the follow-up is to declare 80. What was read (2026-10-09, public Hugging Face API and raw files, no credentials): commit, file names, sizes and LFS sha256 of the 8 pinned file(s) (model.sha256, Hub oids, verified on every run). Licence: custom licence (LICENSE file begins 'The CogVideoX License 1. Definitions “Licensor” means the Co'). Read 2026-10-09 from the Hub without credentials: zai-org/CogVideoX1.5-5B@fdc5267c; card license: other; LICENSE begins 'The CogVideoX License 1. Definitions “Licensor” means the CogVideoX Model Team that distri'. RESTRICTED: custom licence (LICENSE file begins 'The CogVideoX License 1. Definitions “Licensor” means the Co') is a custom, non-OSI or use-based licence (rule in docs/model-registry.md), so the workload is excluded from default selections (docs/manifest.md); name it to run it, and accept the licence yourself. Hardware: requires 1 x 48 GiB (single node); weights 28.9 GiB; max(17.7 largest component, 28.9/1) + 16 = 44.9 GiB per GPU; smallest class holding it at 98% usable: 48 GiB; 1 x 48. The hardware margins are formula values; measured memory is stated above. Task: one video from a fixed prompt and seed (30 steps, guidance 6.0); the output is statistics (channel mean/std, 8x8 block means, gradients, frame-to-frame change), never pixels, with an abs tolerance that is a guess until two GPUs have been compared. Weights are loaded bf16; with more than one GPU diffusers' device_map=balanced places whole components, so the largest component must fit one GPU. Architecture CogVideoXPipeline is listed by the pinned runtime (diffusers 0.41.0 pipelines)."
