name: onnx-zoo-bertsquad-int8
description: "ONNX model zoo BERT-Squad-12 int8 answers four questions over two short paragraphs with onnxruntime."
kind: functional
runtime: onnxruntime
runtime_version: "onnxruntime 1.30.0 (PyPI; CPU wheel on cpu, onnxruntime-gpu on gpu)"
targets: [cpu, gpu]
compare: tolerance
tolerance: {abs: 0.0, rel: 0.0, fields: {span_scores: {abs: 0.75, rel: 0.0}}}
informational: [zoo_logit_err, span_margins]
timeout_s: 900
model:
  id: onnx/models validated/text/machine_comprehension/bert-squad/model/bertsquad-12-int8.tar.gz
  revision: "onnx/models commit c5cae0f1942c8d7727372c7b1f6b485aa39e4421; bertsquad-12-int8.tar.gz sha256 6c33f44ee1949ee25936e259cb68da3e19bea7f6e7d5ea72a4d95ae300c86d87 (= its git-LFS oid); bertsquad-12-int8/bertsquad-12-int8.onnx inside it sha256 24325bdf732256859e07a385d2f363a6839b20b2bb4a57ac362b3982fc8ce121 (= the LFS oid of bertsquad-12-int8.onnx). Vocabulary: npm @xcidos/genesis-memory-model 0.1.0-alpha.1 (tgz sha256 3462d151396de1943a4f69c154223d9473146f3c4e1a1250f98980aa447e9235; npm integrity sha512-kCEWeIgZ...3WvZSA== matches); the package README pins sentence-transformers/all-MiniLM-L6-v2 at Hugging Face revision c9745ed1d9f207416be6d2e6f8de32d1f16199bf"
  licence: Apache-2.0   # bert-squad/README.md at that commit: SPDX header "Apache-2.0" and the "License" section "Apache 2.0". The vocabulary file comes from a third-party npm repackaging (see the notes)
  source_url: https://github.com/onnx/models/tree/main/validated/text/machine_comprehension/bert-squad
notes: >
  Nothing is committed: weights and inputs are fetched at run time and checked against model.sha256
  (tools/ort_assets.py; archives are extracted into the cache and deleted, members are checked again on every
  use). BERT-base uncased fine-tuned on SQuAD v1.1 and quantized to int8 by Intel Neural Compressor (the README
  says so; it states Apache 2.0 and nothing about the SQuAD / Wikipedia training data). The zoo ships no
  vocabulary, so the 30,522-entry uncased vocabulary is read from tokenizer.json of @xcidos/genesis-memory-model
  0.1.0-alpha.1 on npm (sha256 pinned in model.sha256), which carries the same vocabulary as all-MiniLM-L6-v2 (a
  BERT-uncased tokenizer) and says it is Apache-2.0; tools/wordpiece.py is a WordPiece tokenizer written for
  this repo. The answers it gives (checked by eye: helen marsh, 1887, port of sedgwick, grain) show the
  vocabulary and the zoo's model agree. Four questions over two paragraphs written for this repo, one 256-token
  window each. Output: answer text (exact), token spans (exact), start+end logit sum (abs 0.75, no relative part; was abs 0.1 + rel 0.5 %).
  Task output decides, raw numbers inform: the zoo test vector's logit error (`zoo_logit_err`) and each best span's margin over
  the runner-up (`span_margins`) are informational. The run itself fails if the zoo vector deviates by more than 0.1.
  Evidence (docs/int8-and-nondeterminism.md): on an AMD EPYC 7R32 (AVX2, no VNNI; AWS g5) onnxruntime 1.30.0's u8s8 int8
  MatMulInteger saturates and BERT-Squad gives WRONG answers (zoo error 2.225 on the CPU provider and 2.226 under the CUDA EP,
  whose int8 nodes run on the CPU anyway; span margins 0.0002 to 0.004). `tools/ort_tasks.py` therefore sets
  `session.x64quantprecision=1` (7-bit activations on AVX2; PW_ORT_X64QUANT=0 removes it): with it the same host gives
  the reference answers with zoo error 0.032 (CPU) and 0.047 (A10G), span scores within 0.513 (CPU) and 0.444 (A10G) of the
  reference, which was recorded on another CPU. 0.75 is the smallest round value above 0.513 with a margin; the saturated
  result misses by 17.7 to 18.0 and still fails. Each run also fails if the zoo's own test vector (whose inputs are random numbers, not text)
  differs from its expected logits by more than 0.1. int8 ops (DynamicQuantizeLinear, MatMulInteger) have no CUDA kernel and run on the host CPU
  inside the CUDA session, so a GPU run of this model is partly a CPU run. No sim: targets.
