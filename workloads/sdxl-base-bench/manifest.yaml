name: sdxl-base-bench
description: "Stable Diffusion XL base 1.0 (fp16, diffusers) images per second at 1024x1024, 25 steps."
kind: benchmark
runtime: pytorch
targets: [gpu]
timeout_s: 3600
restricted: true
model:
  id: "stabilityai/stable-diffusion-xl-base-1.0 (fp16 variant: unet, text_encoder, text_encoder_2, vae; diffusers StableDiffusionXLPipeline)"
  revision: "462165984030d82259a11f4367a4eed129e94a7b (HF commit); the four fp16 safetensors files are pinned by sha256 in model.sha256 and verified on every run"
  licence: OpenRAIL++-M   # read 2026-10-08 from the official stabilityai/stable-diffusion-xl-base-1.0 @ 46216598: card front matter (license: openrail++) and its LICENSE.md (CreativeML Open RAIL++-M License); the repo is not gated
  source_url: https://huggingface.co/stabilityai/stable-diffusion-xl-base-1.0
notes: "RESTRICTED: the CreativeML Open RAIL++-M licence is a use-based licence (it lists prohibited uses and requires passing those restrictions on); it is not an OSI licence. Not gated, so the official files are used directly; only the fp16 files are downloaded (about 6.9 GB). Same script as sdxl-base-diffusers in bench mode: one warm-up image (not timed), then PW_SDXL_IMAGES=3 timed images with different seeds, whole pipeline including text encoders and VAE decode, batch 1, no torch.compile. Metrics: images_per_s_1024_25steps, unet_steps_per_s. Model load time is excluded. Real GPU only; recorded on one NVIDIA A10G."
