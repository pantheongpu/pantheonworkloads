name: pixtral-12b-2409-bench
description: "Pixtral-12B-2409 (HF-format conversion) (bf16): decode tokens per second, prefill images per second and peak GPU memory."
kind: benchmark
runtime: pytorch
targets: [gpu]
timeout_s: 7766
requires:
  gpus: 1
  gpu_memory_gb: 40
  notes: "weights 23.6 GiB; 23.6/1*1.1 + 4 = 30.0 GiB per GPU; smallest class holding it at 98% usable: 40 GiB; 1 x 40"
model:
  id: "mistral-community/pixtral-12b (vlm; 6 pinned weights file(s), as stored)"
  revision: "c2756cbbb9422eba9f6c5c439a214b0392dfc998 (HF commit); the weights files are pinned by sha256 in model.sha256 and verified on every run"
  licence: "Apache-2.0"
  source_url: https://huggingface.co/mistral-community/pixtral-12b
notes: "VERIFIED ON NVIDIA L40S 48 GB (model catalog, stage 2a, Tier B; sm_89): decode 27.0 tokens/s, prefill 5.932 images/s, peak 25.95 GB (medians of 5 repeats). Run on one AWS g6e.xlarge (NVIDIA L40S, driver 595.91.07, 2026-10-10) with torch 2.14.1+cu130, transformers 5.19.0, diffusers 0.41.0, bfloat16, whole model on the one card. decode 27.0 tokens/s at batch 1 (spread 26.96 to 27.01), prefill 5.932 images/s, peak GPU memory 25.95 GB; 5 repeats. Recorded from a clean checkout at repo commit 454bae3d (repo_dirty false). Functional twin: pixtral-12b-2409-pytorch. Provenance of the pins, read before the run: What was read (2026-10-09, public Hugging Face API and raw files, no credentials): commit, file names, sizes and LFS sha256 of the 6 pinned file(s) (model.sha256, Hub oids, verified on every run). Licence: Apache-2.0. Read 2026-10-09 from the Hub without credentials: mistral-community/pixtral-12b@c2756cbb; card license: apache-2.0 | licence also read from mistralai/Pixtral-12B-2409@a5ca2b7a; card license: apache-2.0. Hardware: requires 1 x 40 GiB (single node); weights 23.6 GiB; 23.6/1*1.1 + 4 = 30.0 GiB per GPU; smallest class holding it at 98% usable: 40 GiB; 1 x 40. The hardware margins are formula values; measured memory is stated above. Task: describes scikit-image's public-domain astronaut.png (sha256 pinned, fetched at run time) in one sentence with greedy decoding; text and token ids compared exactly; a decoding step whose top-1 and top-2 logits are within 0.5 (bf16 noise) fails the run. Weights are loaded bf16 with device_map=auto and the run fails if anything would be offloaded to the CPU. bf16 reasoned, not measured. If the model's processor or chat template differs from the generic image+text chat message, the first real run will fail and need a model-specific prompt. Bench mode of the same script: metrics are throughput and peak memory after warm-up; model load excluded. Architecture LlavaForConditionalGeneration is listed by the pinned runtime (transformers 5.19.0 image-text-to-text types)."
