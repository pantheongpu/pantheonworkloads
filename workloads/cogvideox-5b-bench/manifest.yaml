name: cogvideox-5b-bench
description: "CogVideoX-5b: throughput and peak GPU memory (diffusers)."
kind: benchmark
runtime: pytorch
targets: [gpu]
timeout_s: 7680
restricted: true
requires:
  gpus: 1
  gpu_memory_gb: 40
  notes: "weights 20.0 GiB; max(10.4 largest component, 20.0/1) + 16 = 36.0 GiB per GPU; smallest class holding it at 98% usable: 40 GiB; 1 x 40"
model:
  id: "zai-org/CogVideoX-5b (diffusers; 5 pinned weights file(s), as stored)"
  revision: "8fc5b281006c82b82d34fd2543d2f0ebb4e7e321 (HF commit); the weights files are pinned by sha256 in model.sha256 and verified on every run"
  licence: "custom licence (LICENSE file begins 'The CogVideoX License 1. Definitions “Licensor” means the Co')"
  source_url: https://huggingface.co/zai-org/CogVideoX-5b
notes: "VERIFIED ON NVIDIA L40S 48 GB (model catalog, stage 2a, Tier B; sm_89): 142.247 s per generation, peak 36.98 GB (medians of 5 repeats). Run on one AWS g6e.xlarge (NVIDIA L40S, driver 595.91.07, 2026-10-10) with torch 2.14.1+cu130, transformers 5.19.0, diffusers 0.41.0, bfloat16, whole model on the one card. seconds_per_generation and steps_per_s are the mean of 1 timed generation per repeat after one warm-up generation (PW_DIFFUSION_RUNS=1), 5 repeats; 142.247 s per generation (spread 141.013 to 143.791), 0.211 steps/s, peak GPU memory 36.98 GB (torch max_memory_allocated). Recorded from a clean checkout at repo commit 454bae3d (repo_dirty false). Functional twin: cogvideox-5b-diffusers. Provenance of the pins, read before the run: What was read (2026-10-09, public Hugging Face API and raw files, no credentials): commit, file names, sizes and LFS sha256 of the 5 pinned file(s) (model.sha256, Hub oids, verified on every run). Licence: custom licence (LICENSE file begins 'The CogVideoX License 1. Definitions “Licensor” means the Co'). Read 2026-10-09 from the Hub without credentials: zai-org/CogVideoX-5b@8fc5b281; card license: other, license_link: https://huggingface.co/THUDM/CogVideoX-5b/blob/main/LICENSE; LICENSE begins 'The CogVideoX License 1. Definitions “Licensor” means the CogVideoX Model Team that distri'. RESTRICTED: custom licence (LICENSE file begins 'The CogVideoX License 1. Definitions “Licensor” means the Co') is a custom, non-OSI or use-based licence (rule in docs/model-registry.md), so the workload is excluded from default selections (docs/manifest.md); name it to run it, and accept the licence yourself. Hardware: requires 1 x 40 GiB (single node); weights 20.0 GiB; max(10.4 largest component, 20.0/1) + 16 = 36.0 GiB per GPU; smallest class holding it at 98% usable: 40 GiB; 1 x 40. The hardware margins are formula values; measured memory is stated above. Task: one video from a fixed prompt and seed (30 steps, guidance 6.0); the output is statistics (channel mean/std, 8x8 block means, gradients, frame-to-frame change), never pixels, with an abs tolerance that is a guess until two GPUs have been compared. Weights are loaded bf16; with more than one GPU diffusers' device_map=balanced places whole components, so the largest component must fit one GPU. Bench mode of the same script: metrics are throughput and peak memory after warm-up; model load excluded. Architecture CogVideoXPipeline is listed by the pinned runtime (diffusers 0.41.0 pipelines)."
