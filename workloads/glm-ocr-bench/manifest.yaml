name: glm-ocr-bench
description: "GLM-OCR (bf16): decode tokens per second, prefill images per second and peak GPU memory."
kind: benchmark
runtime: pytorch
targets: [gpu]
timeout_s: 7258
requires:
  gpus: 1
  gpu_memory_gb: 10
  notes: "weights 2.5 GiB; 2.5/1*1.1 + 4 = 6.7 GiB per GPU; smallest class holding it at 98% usable: 10 GiB; 1 x 10"
model:
  id: "zai-org/GLM-OCR (vlm; 1 pinned weights file(s), as stored)"
  revision: "2e85a62840ccac27daa451df36c736c4636b8628 (HF commit); the weights files are pinned by sha256 in model.sha256 and verified on every run"
  licence: "MIT"
  source_url: https://huggingface.co/zai-org/GLM-OCR
notes: "VERIFIED ON NVIDIA A10G (model catalog, stage 2a, 2026-10-10): first real run on NVIDIA A10G (one on-demand g5.2xlarge, 22 GiB, driver 595.91.07, Ubuntu 22.04); the functional twin `glm-ocr-pytorch` passed there. Benchmark recorded at 5 repeats: decode_tokens_per_s_b1 51.9, peak_gpu_memory_gb 2.29, prefill_images_per_s_b1 14.851 (median of 5 repeats, bench/glm-ocr-bench/20261010T063506Z-nvidia-a10g.json). Software: torch 2.14.1+cu130, torchvision 0.29.1+cu130, transformers 5.19.0, diffusers 0.41.0, numpy 2.5.3. Provenance, written from Hub metadata on 2026-10-09 before this run: What was read (2026-10-09, public Hugging Face API and raw files, no credentials): commit, file names, sizes and LFS sha256 of the 1 pinned file(s) (model.sha256, Hub oids, verified on every run). Licence: MIT. Read 2026-10-09 from the Hub without credentials: zai-org/GLM-OCR@2e85a628; card license: mit; card licence section: 'The GLM-OCR model is released under the MIT License.'. Hardware: requires 1 x 10 GiB (single node); weights 2.5 GiB; 2.5/1*1.1 + 4 = 6.7 GiB per GPU; smallest class holding it at 98% usable: 10 GiB; 1 x 10. These margins were assumptions; this workload ran within them on one 22.5 GiB A10G. Task: reads two lines of text drawn at run time with Pillow (\"The quick brown fox\" / \"jumps over 13 lazy dogs.\") with greedy decoding; the run also fails when the words quick, brown and fox are not in the output, whatever a reference says; text and token ids compared exactly; a decoding step whose top-1 and top-2 logits are within 0.5 (bf16 noise) fails the run. Weights are loaded bf16 with device_map=auto and the run fails if anything would be offloaded to the CPU. Bench mode of the same script: metrics are throughput and peak memory after warm-up; model load excluded. Architecture GlmOcrForConditionalGeneration is listed by the pinned runtime (transformers 5.19.0 image-text-to-text types)."
