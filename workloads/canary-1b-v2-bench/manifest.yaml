name: canary-1b-v2-bench
description: "canary-1b-v2: throughput and peak GPU memory (asr)."
kind: benchmark
runtime: pytorch
targets: [gpu]
timeout_s: 7242
requires:
  gpus: 1
  gpu_memory_gb: 10
  notes: "weights 1.8 GiB; 1.8/1*1.1 + 4 = 6.0 GiB per GPU; smallest class holding it at 98% usable: 10 GiB; 1 x 10"
model:
  id: "nvidia/canary-1b-v2 (asr; 1 pinned weights file(s), as stored (.nemo))"
  revision: "d455706339a6b32e1aa40f82c713a482a0c938e2 (HF commit); the weights files are pinned by sha256 in model.sha256 and verified on every run"
  licence: "CC-BY-4.0"
  source_url: https://huggingface.co/nvidia/canary-1b-v2
notes: "VERIFIED ON NVIDIA A10G (model catalog, stage 2a, 2026-10-10): first real run on NVIDIA A10G (one on-demand g5.2xlarge, 22 GiB, driver 595.91.07, Ubuntu 22.04); the functional twin `canary-1b-v2-pytorch` passed there. Benchmark recorded at 5 repeats: audio_seconds_per_s 29.79 (median of 5 repeats, bench/canary-1b-v2-bench/20261010T060910Z-nvidia-a10g.json). Software: torch 2.14.1+cu130, torchvision 0.29.1+cu130, transformers 5.19.0, numpy 2.5.3. Own venv (PW_VENV_NAME=nemo): nemo_toolkit[asr]==3.0.0 on the shared torch 2.14.1 stack, installed without conflict. A first attempt failed with CUDA out of memory only because a llama.cpp run was sharing the card. Provenance, written from Hub metadata on 2026-10-09 before this run: What was read (2026-10-09, public Hugging Face API and raw files, no credentials): commit, file names, sizes and LFS sha256 of the 1 pinned file(s) (model.sha256, Hub oids, verified on every run). Licence: CC-BY-4.0. Read 2026-10-09 from the Hub without credentials: nvidia/canary-1b-v2@d4557063; card license: cc-by-4.0. Hardware: requires 1 x 10 GiB (single node); weights 1.8 GiB; 1.8/1*1.1 + 4 = 6.0 GiB per GPU; smallest class holding it at 98% usable: 10 GiB; 1 x 10. These margins were assumptions; this workload ran within them on one 22.5 GiB A10G. Task: transcribe the 11 s clip jfk.wav of whisper.cpp (pinned commit and sha256, fetched at run time; its provenance is stated nowhere, see docs/models.md); output = the transcript with only lower-case letters, compared by word error rate (<= 0.1 against a reference) and checked against the known words (<= 0.15) on every run. Bench mode of the same script: metrics are throughput and peak memory after warm-up; model load excluded. Architecture CanaryForConditionalGeneration is listed by the pinned runtime (transformers 5.19.0 model types)."
