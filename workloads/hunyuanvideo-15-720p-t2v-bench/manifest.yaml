name: hunyuanvideo-15-720p-t2v-bench
description: "HunyuanVideo-1.5 720p T2V: throughput and peak GPU memory (diffusers)."
kind: benchmark
runtime: pytorch
targets: [gpu]
timeout_s: 7796
restricted: true
requires:
  gpus: 1
  gpu_memory_gb: 44
  notes: "weights 24.9 GiB; max(15.5 largest component, 24.9/1) + 16 = 40.9 GiB per GPU; smallest class holding it at 98% usable: 44 GiB; 1 x 44"
model:
  id: "hunyuanvideo-community/HunyuanVideo-1.5-Diffusers-720p_t2v (diffusers; 13 pinned weights file(s), stored fp32, loaded bf16)"
  revision: "f4dbc4a1efa4ac8ea56680cdf79d9f455105e814 (HF commit); the weights files are pinned by sha256 in model.sha256 and verified on every run"
  licence: "Tencent Hunyuan Community License"
  source_url: https://huggingface.co/hunyuanvideo-community/HunyuanVideo-1.5-Diffusers-720p_t2v
notes: "VERIFIED ON NVIDIA L40S 48 GB (model catalog, stage 2a, Tier B; sm_89): 175.541 s per generation, peak 37.93 GB (medians of 5 repeats). Run on one AWS g6e.xlarge (NVIDIA L40S, driver 595.91.07, 2026-10-10) with torch 2.14.1+cu130, transformers 5.19.0, diffusers 0.41.0, bfloat16, whole model on the one card. seconds_per_generation and steps_per_s are the mean of 1 timed generation per repeat after one warm-up generation (PW_DIFFUSION_RUNS=1), 5 repeats; 175.541 s per generation (spread 175.201 to 175.745), 0.171 steps/s, peak GPU memory 37.93 GB (torch max_memory_allocated). Recorded from a clean checkout at repo commit 454bae3d (repo_dirty false). Functional twin: hunyuanvideo-15-720p-t2v-diffusers. Provenance of the pins, read before the run: What was read (2026-10-09, public Hugging Face API and raw files, no credentials): commit, file names, sizes and LFS sha256 of the 13 pinned file(s) (model.sha256, Hub oids, verified on every run). Licence: Tencent Hunyuan Community License. Read 2026-10-09 from the Hub without credentials: hunyuanvideo-community/HunyuanVideo-1.5-Diffusers-720p_t2v@f4dbc4a1; card license: other | licence also read from tencent/HunyuanVideo-1.5@9b49404b; card license: other, license_name: tencent-hunyuan-community, license_link: https://github.com/Tencent-Hunyuan/HunyuanVideo-1.5/blob/master/LICENSE; LICENSE begins 'TENCENT HUNYUAN COMMUNITY LICENSE AGREEMENT Tencent HunyuanVideo 1.5 Release Date: Novembe'; NOTICE begins 'This project is built on and with the aid of the following open source projects. Credits a'. RESTRICTED: Tencent Hunyuan Community License is a custom, non-OSI or use-based licence (rule in docs/model-registry.md), so the workload is excluded from default selections (docs/manifest.md); name it to run it, and accept the licence yourself. Hardware: requires 1 x 44 GiB (single node); weights 24.9 GiB; max(15.5 largest component, 24.9/1) + 16 = 40.9 GiB per GPU; smallest class holding it at 98% usable: 44 GiB; 1 x 44. The hardware margins are formula values; measured memory is stated above. Task: one video from a fixed prompt and seed (30 steps, guidance 6.0); the output is statistics (channel mean/std, 8x8 block means, gradients, frame-to-frame change), never pixels, with an abs tolerance that is a guess until two GPUs have been compared. Weights are loaded bf16; with more than one GPU diffusers' device_map=balanced places whole components, so the largest component must fit one GPU. Bench mode of the same script: metrics are throughput and peak memory after warm-up; model load excluded. Architecture HunyuanVideo15Pipeline is listed by the pinned runtime (diffusers 0.41.0 pipelines)."
