name: llamacpp-smollm2-135m
description: llama.cpp (llama-completion) greedy-decodes 3 tokens from SmolLM2-135M-Instruct (Q8_0 GGUF).
kind: functional
runtime: llama.cpp
runtime_version: "llama.cpp b11447 (da263e7275dfbaeefcd61504eaa4fd5247540e11)"
targets: [cpu, gpu, "sim:nvidia/*", "sim:amd/*"]
compare: exact
timeout_s: 3600
model:
  id: bartowski/SmolLM2-135M-Instruct-GGUF (SmolLM2-135M-Instruct-Q8_0.gguf; a community Q8_0 conversion of HuggingFaceTB/SmolLM2-135M-Instruct, no official GGUF repo exists under that name)
  revision: "09816acd5d99df7be770d85ea30822623dab342c (HF commit of the GGUF repo); file sha256 5a1395716f7913741cc51d98581b9b1228d80987a9f7d3664106742eb06bba83"
  licence: Apache-2.0   # read 2026-10-08 from the GGUF repo card front matter (license: apache-2.0) and the base model HuggingFaceTB/SmolLM2-135M-Instruct card (apache-2.0); the repo has no LICENSE file
  source_url: https://huggingface.co/bartowski/SmolLM2-135M-Instruct-GGUF
notes: >
  llama.cpp itself is MIT (LICENSE read at the pinned commit). The model licence, file name and download
  URL were NOT checked: huggingface.co was unreachable (proxy 403) when this was written. Verify the
  card, then fill in revision, licence and model.sha256.
  Backends: cpu (portable CPU build, no offload), gpu (CUDA or ROCm/HIP build, detected or
  PW_LLAMACPP_BACKEND), sim:nvidia/* (CUDA build under pantheonsim's cuda shims), sim:amd/* (HIP build
  under pantheonsim's libamdhip64/libhsa shims). The sim: wiring mirrors pantheonsim's run_ollama.sh and
  run_ollama_amd.sh and has never been run. Build and knobs: docs/llamacpp.md.
  Prompt "The capital of France is", -n 3, --temp 0, seed 1, no chat template. Keep it short: longer
  decodes diverge on floating-point differences between backends.
