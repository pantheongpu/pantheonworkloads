name: chronos-t5-large-pytorch
description: "Chronos T5 Large (timeseries) on a fixed input; the result is compared with a tolerance."
kind: functional
runtime: pytorch
targets: [gpu]
compare: tolerance
tolerance:
  abs: 0.2
  rel: 0.05
timeout_s: 3615
requires:
  gpus: 1
  gpu_memory_gb: 10
  notes: "weights 1.3 GiB; 1.3/1*1.1 + 4 = 5.5 GiB per GPU; smallest class holding it at 98% usable: 10 GiB; 1 x 10"
model:
  id: "amazon/chronos-t5-large (timeseries; 1 pinned weights file(s), as stored)"
  revision: "0e46c9c7e2e9f74b53db0617fdfcfe42a413e54a (HF commit); the weights files are pinned by sha256 in model.sha256 and verified on every run"
  licence: "Apache-2.0"
  source_url: https://huggingface.co/amazon/chronos-t5-large
notes: "VERIFIED ON NVIDIA A10G (model catalog, stage 2a, 2026-10-10): first real run. Reference recorded with `bin/pw record --target gpu` on NVIDIA A10G (one on-demand g5.2xlarge, 22 GiB, driver 595.91.07, Ubuntu 22.04) and identical in 3 further consecutive runs. Software: torch 2.14.1+cu130, torchvision 0.29.1+cu130, transformers 5.19.0, diffusers 0.41.0, numpy 2.5.3. chronos-forecasting 2.3.2 from requirements-chronos.txt (five small packages added to the shared venv). Provenance, written from Hub metadata on 2026-10-09 before this run: What was read (2026-10-09, public Hugging Face API and raw files, no credentials): commit, file names, sizes and LFS sha256 of the 1 pinned file(s) (model.sha256, Hub oids, verified on every run). Licence: Apache-2.0. Read 2026-10-09 from the Hub without credentials: amazon/chronos-t5-large@0e46c9c7; card license: apache-2.0; card licence section: 'This project is licensed under the Apache-2.0 License.'. Hardware: requires 1 x 10 GiB (single node); weights 1.3 GiB; 1.3/1*1.1 + 4 = 5.5 GiB per GPU; smallest class holding it at 98% usable: 10 GiB; 1 x 10. These margins were assumptions; this workload ran within them on one 22.5 GiB A10G. Task: 24-step forecast of a synthetic seasonal series made with numpy; the run fails when the forecast does not follow the season (correlation >= 0.8). Architecture T5ForConditionalGeneration is listed by the pinned runtime (transformers 5.19.0 model types)."
