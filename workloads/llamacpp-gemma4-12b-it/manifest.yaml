notes: "VERIFIED ON NVIDIA A10G (model catalog, stage 2a, 2026-10-10): first real run. Reference recorded with `bin/pw record --target gpu` on NVIDIA A10G (one on-demand g5.2xlarge, 22 GiB, driver 595.91.07, Ubuntu 22.04) and identical in 3 further consecutive runs. Software: llama.cpp b11447 (da263e7275dfbaeefcd61504eaa4fd5247540e11), CUDA build for sm_86. PROMPT FIX (2026-10-30, A10G, same rig software, driver 595.x): the first reference was degenerate. With the raw prompt 'The capital of France is' (no chat template) this checkpoint printed '011' (longer decodes '0111111...') on the GPU and the CPU alike, for four prompts, while the other Gemma 4 GGUFs answer ' Paris'. Root cause: this is an instruction-tuned QAT checkpoint and it only behaves inside Gemma 4's turn format; outside it the next-token distribution is not a language-model continuation (why the 12B is affected and E2B, 26B-A4B and 31B are not is not established; the loader also warns that token 212 '</s>' is not control-type and overrides it). Findings: (a) -cnv -st --jinja applies the model's own template, but with it the system turn carries the <|think|> token and the model starts a '<|channel>thought' monologue; '-rea off' did not remove it in llama-completion and --chat-template-kwargs gave no output, so 3 tokens would be '<|channel>thought ...'; (b) the template's own rendering with thinking off (the 'chat template example' the loader prints) ends '<|turn>model\n<|channel>thought\n<channel|>'; (c) sending exactly that text with -no-cnv answers 'Paris' and then the end-of-turn token '<turn|>' (end of generation, so fewer than 3 tokens are printed). The workload now sends '<|turn>user\nWhat is the capital of France? Answer in one word.<turn|>\n<|turn>model\n<|channel>thought\n<channel|>' (BOS is added by llama.cpp), temp 0, seed 1, -n 3, -c 256, -ngl 99; reference 'Paris [end of text]'. Recorded with `bin/pw record --target gpu` on NVIDIA A10G and identical in 3 further consecutive runs. Margin / near-tie check: the answer is also 'Paris [end of text]' with flash attention off, -ub 64 and on the CPU (-ngl 0, 8 threads), and with a logit bias on the 'Paris' token (id 50429) of -0.5, -1, -2, -4 and -8 it still wins; only at -16 does another token (the thought channel) overtake, so the first-token margin is between 8 and 16 logits, far from a tie. The bench twin (llama-bench pp512/tg128) does not depend on the prompt and the pinned file is unchanged, so it is not re-recorded. Earlier (2026-10-10) record, kept for history: the reference then documented determinism, not quality. Provenance, written from Hub metadata on 2026-10-09 before this run: What was read (2026-10-09, public Hugging Face API and raw files, no credentials): commit, file names, sizes and LFS sha256 of the 1 pinned file(s) (model.sha256, Hub oids, verified on every run). Licence: Apache-2.0. Read 2026-10-09 from the Hub without credentials: google/gemma-4-12B-it@707f0a3b; card license: apache-2.0, license_link: https://ai.google.dev/gemma/docs/gemma_4_license | downloaded repository google/gemma-4-12B-it-qat-q4_0-gguf@29d09777; card license: apache-2.0, license_link: https://ai.google.dev/gemma/docs/gemma_4_license; its card carries a licence agreement text: False. Hardware: requires 1 x 15 GiB (single node); weights 6.5 GiB; 6.5/1*1.05 + 3 = 9.8 GiB per GPU; smallest class holding it at 98% usable: 15 GiB; 1 x 15. These margins were assumptions; this workload ran within them on one 22.5 GiB A10G. Task: the Gemma 4 chat-formatted prompt above, -n 3, --temp 0, seed 1, -c 256, -ngl 99 (layers split over the GPUs llama.cpp sees, --split-mode layer by default); output compared exactly with reference.json. Build and knobs: docs/llamacpp.md."
