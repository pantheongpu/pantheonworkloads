  licence: "CC-BY-NC-4.0"
  source_url: https://huggingface.co/depth-anything/Depth-Anything-V2-Large-hf
notes: "VERIFIED ON NVIDIA A10G (model catalog, stage 2a, 2026-10-10): first real run on NVIDIA A10G (one on-demand g5.2xlarge, 22 GiB, driver 595.91.07, Ubuntu 22.04); the functional twin `depth-anything-v2-large-pytorch` passed there. Benchmark recorded at 5 repeats: images_per_s_b1 8.93, peak_gpu_memory_gb 1.68 (median of 5 repeats, bench/depth-anything-v2-large-bench/20261010T062113Z-nvidia-a10g.json). Software: torch 2.14.1+cu130, torchvision 0.29.1+cu130, transformers 5.19.0, diffusers 0.41.0, numpy 2.5.3. Provenance, written from Hub metadata on 2026-10-09 before this run: What was read (2026-10-09, public Hugging Face API and raw files, no credentials): commit, file names, sizes and LFS sha256 of the 1 pinned file(s) (model.sha256, Hub oids, verified on every run). Licence: CC-BY-NC-4.0. Read 2026-10-09 from the Hub without credentials: depth-anything/Depth-Anything-V2-Large-hf@7581137e; card license: cc-by-nc-4.0. RESTRICTED: CC-BY-NC-4.0 is a custom, non-OSI or use-based licence (rule in docs/model-registry.md), so the workload is excluded from default selections (docs/manifest.md); name it to run it, and accept the licence yourself. Hardware: requires 1 x 10 GiB (single node); weights 0.6 GiB; 0.6/1*1.1 + 4 = 4.7 GiB per GPU; smallest class holding it at 98% usable: 10 GiB; 1 x 10. These margins were assumptions; this workload ran within them on one 22.5 GiB A10G. Task: head 'depth' on scikit-image's public-domain astronaut.png (sha256 pinned, fetched at run time); see workloads/_pytorch/vision.py for the statistics compared. Bench mode of the same script: metrics are throughput and peak memory after warm-up; model load excluded. Architecture DepthAnythingForDepthEstimation is listed by the pinned runtime (transformers 5.19.0 model types)."
