requires:
  gpus: 1
  gpu_memory_gb: 10
  notes: "weights 0.6 GiB; 0.6/1*1.1 + 4 = 4.7 GiB per GPU; smallest class holding it at 98% usable: 10 GiB; 1 x 10"
