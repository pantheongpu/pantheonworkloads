name: paddleocr-vl-bench
description: "PaddleOCR-VL (bf16): decode tokens per second, prefill images per second and peak GPU memory."
kind: benchmark
runtime: pytorch
targets: [gpu]
timeout_s: 7242
requires:
  gpus: 1
  gpu_memory_gb: 10
  notes: "weights 1.8 GiB; 1.8/1*1.1 + 4 = 6.0 GiB per GPU; smallest class holding it at 98% usable: 10 GiB; 1 x 10"
model:
  id: "PaddlePaddle/PaddleOCR-VL (vlm; 1 pinned weights file(s), as stored)"
  revision: "7fa00a8c55b735ba51ba49a9058f3f9c57a99a11 (HF commit); the weights files are pinned by sha256 in model.sha256 and verified on every run"
  licence: "Apache-2.0"
  source_url: https://huggingface.co/PaddlePaddle/PaddleOCR-VL
notes: "VERIFIED ON NVIDIA A10G (model catalog, stage 2a, 2026-10-10): first real run on NVIDIA A10G (one on-demand g5.2xlarge, 22 GiB, driver 595.91.07, Ubuntu 22.04); the functional twin `paddleocr-vl-pytorch` passed there. Benchmark recorded at 5 repeats: decode_tokens_per_s_b1 19.15, peak_gpu_memory_gb 1.92, prefill_images_per_s_b1 16.909 (median of 5 repeats, bench/paddleocr-vl-bench/20261010T064621Z-nvidia-a10g.json). Software: torch 2.14.1+cu130, torchvision 0.29.1+cu130, transformers 5.19.0, diffusers 0.41.0, numpy 2.5.3. Provenance, written from Hub metadata on 2026-10-09 before this run: What was read (2026-10-09, public Hugging Face API and raw files, no credentials): commit, file names, sizes and LFS sha256 of the 1 pinned file(s) (model.sha256, Hub oids, verified on every run). Licence: Apache-2.0. Read 2026-10-09 from the Hub without credentials: PaddlePaddle/PaddleOCR-VL@7fa00a8c; card license: apache-2.0; LICENSE begins 'Apache License Version 2.0, January 2004 http://www.apache.org/licenses/ TERMS AND CONDITI'. Hardware: requires 1 x 10 GiB (single node); weights 1.8 GiB; 1.8/1*1.1 + 4 = 6.0 GiB per GPU; smallest class holding it at 98% usable: 10 GiB; 1 x 10. These margins were assumptions; this workload ran within them on one 22.5 GiB A10G. Task: reads two lines of text drawn at run time with Pillow (\"The quick brown fox\" / \"jumps over 13 lazy dogs.\") with greedy decoding; the run also fails when the words quick, brown and fox are not in the output, whatever a reference says; text and token ids compared exactly; a decoding step whose top-1 and top-2 logits are within 0.5 (bf16 noise) fails the run. Weights are loaded bf16 with device_map=auto and the run fails if anything would be offloaded to the CPU. Bench mode of the same script: metrics are throughput and peak memory after warm-up; model load excluded. Architecture PaddleOCRVLForConditionalGeneration is listed by the pinned runtime (transformers 5.19.0 image-text-to-text types)."
