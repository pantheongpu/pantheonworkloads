name: f5-tts-bench
description: "F5-TTS (v1 Base): throughput and peak GPU memory (tts)."
kind: benchmark
runtime: pytorch
targets: [gpu]
timeout_s: 7230
restricted: true
requires:
  gpus: 1
  gpu_memory_gb: 10
  notes: "weights 1.3 GiB; 1.3/1*1.1 + 4 = 5.4 GiB per GPU; smallest class holding it at 98% usable: 10 GiB; 1 x 10"
model:
  id: "SWivid/F5-TTS (tts; 1 pinned weights file(s), as stored)"
  revision: "84e5a410d9cead4de2f847e7c9369a6440bdfaca (HF commit); the weights files are pinned by sha256 in model.sha256 and verified on every run"
  licence: "CC-BY-NC-4.0"
  source_url: https://huggingface.co/SWivid/F5-TTS
notes: "WRITTEN, NEVER RUN: nothing in this workload has been executed; no weights were downloaded and no GPU was used. What was read (2026-10-09, public Hugging Face API and raw files, no credentials): commit, file names, sizes and LFS sha256 of the 1 pinned file(s) (model.sha256, Hub oids, verified on every run). Licence: CC-BY-NC-4.0. Read 2026-10-09 from the Hub without credentials: SWivid/F5-TTS@84e5a410; card license: cc-by-nc-4.0. RESTRICTED: CC-BY-NC-4.0 is a custom, non-OSI or use-based licence (rule in docs/model-registry.md), so the workload is excluded from default selections (docs/manifest.md); name it to run it, and accept the licence yourself. Hardware: requires 1 x 10 GiB (single node); weights 1.3 GiB; 1.3/1*1.1 + 4 = 5.4 GiB per GPU; smallest class holding it at 98% usable: 10 GiB; 1 x 10. These margins are assumptions, not measurements. Task: synthesise one fixed sentence; the waveform is checked (finite, 1 s or longer, not silent), output = duration rounded to 0.5 s and the RMS level, abs tolerance 0.03. The generator is sampled, so this is a plausibility check, not a regression test of the audio. Bench mode of the same script: metrics are throughput and peak memory after warm-up; model load excluded. Not verified: that the pinned library versions load this checkpoint, the output, the tolerances, speed, memory. No reference.json, no bench record."
