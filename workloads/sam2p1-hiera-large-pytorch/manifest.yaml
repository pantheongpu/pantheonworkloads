notes: "VERIFIED ON NVIDIA A10G (model catalog, stage 2a, 2026-10-10): first real run. Reference recorded with `bin/pw record --target gpu` on NVIDIA A10G (one on-demand g5.2xlarge, 22 GiB, driver 595.91.07, Ubuntu 22.04) and identical in 3 further consecutive runs. Software: torch 2.14.1+cu130, torchvision 0.29.1+cu130, transformers 5.19.0, diffusers 0.41.0, numpy 2.5.3. Provenance, written from Hub metadata on 2026-10-09 before this run: What was read (2026-10-09, public Hugging Face API and raw files, no credentials): commit, file names, sizes and LFS sha256 of the 1 pinned file(s) (model.sha256, Hub oids, verified on every run). Licence: Apache-2.0. Read 2026-10-09 from the Hub without credentials: facebook/sam2.1-hiera-large@665f8e2a; card license: apache-2.0. Hardware: requires 1 x 10 GiB (single node); weights 0.4 GiB; 0.4/1*1.1 + 4 = 4.5 GiB per GPU; smallest class holding it at 98% usable: 10 GiB; 1 x 10. These margins were assumptions; this workload ran within them on one 22.5 GiB A10G. Task: head 'sam2' on scikit-image's public-domain astronaut.png (sha256 pinned, fetched at run time); see workloads/_pytorch/vision.py for the statistics compared. Architecture Sam2VideoModel is listed by the pinned runtime (transformers 5.19.0 model types)."
