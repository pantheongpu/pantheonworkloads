notes: "VERIFIED ON NVIDIA A10G (model catalog, stage 2a, 2026-10-10): first real run. Reference recorded with `bin/pw record --target gpu` on NVIDIA A10G (one on-demand g5.2xlarge, 22 GiB, driver 595.91.07, Ubuntu 22.04) and identical in 3 further consecutive runs. Software: torch 2.14.1+cu130, torchvision 0.29.1+cu130, transformers 5.19.0, diffusers 0.41.0, numpy 2.5.3. Changed in this run: the first run failed because the feature extractor needs librosa; requirements-asr.txt adds librosa==1.0.0 to the VLM requirements. Provenance, written from Hub metadata on 2026-10-09 before this run: What was read (2026-10-09, public Hugging Face API and raw files, no credentials): commit, file names, sizes and LFS sha256 of the 1 pinned file(s) (model.sha256, Hub oids, verified on every run). Licence: CC-BY-4.0. Read 2026-10-09 from the Hub without credentials: nvidia/parakeet-tdt-0.6b-v3@541d1f99; card license: cc-by-4.0. Hardware: requires 1 x 10 GiB (single node); weights 1.2 GiB; 1.2/1*1.1 + 4 = 5.3 GiB per GPU; smallest class holding it at 98% usable: 10 GiB; 1 x 10. These margins were assumptions; this workload ran within them on one 22.5 GiB A10G. Task: transcribe the 11 s clip jfk.wav of whisper.cpp (pinned commit and sha256, fetched at run time; its provenance is stated nowhere, see docs/models.md); output = the transcript with only lower-case letters, compared by word error rate (<= 0.1 against a reference) and checked against the known words (<= 0.15) on every run. Architecture ParakeetForTDT is listed by the pinned runtime (transformers 5.19.0 model types)."
