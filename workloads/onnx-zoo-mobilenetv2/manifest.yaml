name: onnx-zoo-mobilenetv2
description: ONNX model zoo MobileNetV2-12 classifies the zoo's own preprocessed test image with onnxruntime.
kind: functional
runtime: onnxruntime
runtime_version: "onnxruntime 1.30.0 (PyPI; CPU wheel on cpu, onnxruntime-gpu on gpu)"
targets: [cpu, gpu]
compare: tolerance
tolerance: {abs: 0.0, rel: 0.0, fields: {top_logits: {abs: 0.01, rel: 0.001}}}
timeout_s: 900
model:
  id: onnx/models validated/vision/classification/mobilenet/model/mobilenetv2-12.onnx
  revision: "onnx/models commit c5cae0f1942c8d7727372c7b1f6b485aa39e4421; mobilenetv2-12.onnx sha256 c0c3f76d93fa3fd6580652a45618618a220fced18babf65774ed169de0432ad5 (= its git-LFS oid)"
  licence: Apache-2.0   # mobilenet/README.md "License" section at that commit and repo LICENSE
  source_url: https://github.com/onnx/models/tree/main/validated/vision/classification/mobilenet
notes: >
  Nothing is committed: weights and inputs are fetched at run time and checked against model.sha256
  (tools/ort_assets.py). Input and expected output: test_data_set_0 in the zoo's mobilenetv2-12.tar.gz
  (an ImageNet-style preprocessed tensor); the run also fails if the logits differ from the zoo's own
  by more than 1e-3. Output: top-5 class ids (exact) and logits (abs 0.01 + rel 1e-3). Weights were
  trained on ImageNet; the zoo declares Apache 2.0 for the model and says nothing about the training
  data's terms. No sim: targets.
