name: moonshine-tiny-en-onnx
description: Moonshine tiny (English, int8 ONNX) transcribes two 16 kHz speech clips with onnxruntime.
kind: functional
runtime: onnxruntime
runtime_version: "onnxruntime 1.30.0 (PyPI; CPU wheel on cpu, onnxruntime-gpu on gpu)"
targets: [cpu, gpu]
compare: tolerance
tolerance: {abs: 0.0, rel: 0.0, fields: {text: {wer: 0.03}}}
informational: [token_ids, min_logit_gap]
timeout_s: 1800
model:
  id: usefulsensors/moonshine tiny English (v1), int8 ONNX export by k2-fsa/sherpa-onnx (sherpa-onnx-moonshine-tiny-en-int8.tar.bz2)
  revision: "k2-fsa/sherpa-onnx release tag asr-models (a rolling tag), archive sha256 d5fe6ec4334fef36255b2a4010412cad4c007e33103fec62fb5d17cad88086f2 (files dated 2024-10-26 inside); each file used is pinned by its own sha256 in model.sha256"
  licence: MIT   # LICENSE inside the archive (MIT, Copyright 2024 Useful Sensors); usefulsensors/moonshine README at commit 234f60faa0eb388b01cdf7e60aca232af37aefda, "License": the code and the models are MIT, the exceptions being legacy non-English non-streaming models
  source_url: https://github.com/k2-fsa/sherpa-onnx/releases/tag/asr-models
notes: >
  Nothing is committed: the archive is fetched at run time (about 108 MB), the pinned members are
  extracted into the cache (about 124 MB) and the archive is deleted (tools/ort_assets.py). Runtime: onnxruntime
  directly (preprocess, encode, uncached_decode, cached_decode ONNX files, greedy search, at most 6 tokens
  per second of audio), written after sherpa-onnx's offline-moonshine-greedy-search-decoder.cc; on the
  development machine the two transcripts and token counts were identical to sherpa-onnx 1.13.8's
  OfflineRecognizer.from_moonshine. Input: test_wavs/0.wav and 1.wav from the same archive (LibriSpeech-style
  read English, 6.6 s and 16.7 s; the archive does not state the recordings' provenance or licence, so they
  are fetched, never committed). Output: the transcripts, compared by word error rate against the reference text
  (case and punctuation ignored) with a maximum of 0.03; the token ids and the smallest top-1/top-2 logit gap of the greedy decode
  (`min_logit_gap`) are informational. The run also
  fails when the word error rate against the archive's own trans.txt exceeds PW_ASR_WER_MAX (0.15; it is
  0.021 on the cpu recording, case and punctuation ignored).
  Evidence (docs/int8-and-nondeterminism.md): greedy decoding has near ties (smallest top1-top2 logit gap 0.002 to 0.13 in logit units) and
  the int8 CPU kernels and the CUDA fp32 kernels do not round identically, so the transcript flips. Over 11 consecutive runs on an A10G
  (g5, AMD EPYC 7R32, 7-bit int8 mode) the text equalled the reference in 2, added a comma after "parent" in 9 (WER 0, token 29892) and
  once also wrote "dishonored" for "dishonoured" (WER 0.0154, one word of 65); without 7-bit mode, 6 runs: the same two kinds, worst 0.0154. The CPU provider
  is stable run to run (the EPYC adds the comma, an Ice Lake Xeon reproduces the reference tokens exactly). 0.03 is the smallest round value above 0.0154 with a margin
  (two changed words fail). The model is int8 only (dynamically
  quantised): on the gpu target the CUDA/ROCm execution providers have no kernels for some integer ops,
  so onnxruntime keeps those nodes on its CPU provider inside the same session. The provider check
  (the session must report the GPU provider first) passes, but a GPU benchmark of this model would
  measure a mixed placement. No sim: targets.
