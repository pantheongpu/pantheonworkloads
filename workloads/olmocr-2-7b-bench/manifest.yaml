name: olmocr-2-7b-bench
description: "olmOCR-2-7B-1025 (bf16): decode tokens per second, prefill images per second and peak GPU memory."
kind: benchmark
runtime: pytorch
targets: [gpu]
timeout_s: 7570
requires:
  gpus: 1
  gpu_memory_gb: 22
  notes: "weights 15.4 GiB; 15.4/1*1.1 + 4 = 21.0 GiB per GPU; smallest class holding it at 98% usable: 22 GiB; 1 x 22"
model:
  id: "allenai/olmOCR-2-7B-1025 (vlm; 4 pinned weights file(s), as stored)"
  revision: "e52d6f090b7a9007afffbbd6ce510876222fea93 (HF commit); the weights files are pinned by sha256 in model.sha256 and verified on every run"
  licence: "Apache-2.0"
  source_url: https://huggingface.co/allenai/olmOCR-2-7B-1025
notes: "VERIFIED ON NVIDIA A10G (model catalog, stage 2a, 2026-10-10): first real run on NVIDIA A10G (one on-demand g5.2xlarge, 22 GiB, driver 595.91.07, Ubuntu 22.04); the functional twin `olmocr-2-7b-pytorch` passed there. Benchmark recorded at 5 repeats: decode_tokens_per_s_b1 28.8, peak_gpu_memory_gb 16.68, prefill_images_per_s_b1 4.971 (median of 5 repeats, bench/olmocr-2-7b-bench/20261010T064111Z-nvidia-a10g.json). Software: torch 2.14.1+cu130, torchvision 0.29.1+cu130, transformers 5.19.0, diffusers 0.41.0, numpy 2.5.3. Provenance, written from Hub metadata on 2026-10-09 before this run: What was read (2026-10-09, public Hugging Face API and raw files, no credentials): commit, file names, sizes and LFS sha256 of the 4 pinned file(s) (model.sha256, Hub oids, verified on every run). Licence: Apache-2.0. Read 2026-10-09 from the Hub without credentials: allenai/olmOCR-2-7B-1025@e52d6f09; card license: apache-2.0. Hardware: requires 1 x 22 GiB (single node); weights 15.4 GiB; 15.4/1*1.1 + 4 = 21.0 GiB per GPU; smallest class holding it at 98% usable: 22 GiB; 1 x 22. These margins were assumptions; this workload ran within them on one 22.5 GiB A10G. Task: reads two lines of text drawn at run time with Pillow (\"The quick brown fox\" / \"jumps over 13 lazy dogs.\") with greedy decoding; the run also fails when the words quick, brown and fox are not in the output, whatever a reference says; text and token ids compared exactly; a decoding step whose top-1 and top-2 logits are within 0.5 (bf16 noise) fails the run. Weights are loaded bf16 with device_map=auto and the run fails if anything would be offloaded to the CPU. Bench mode of the same script: metrics are throughput and peak memory after warm-up; model load excluded. Architecture Qwen2_5_VLForConditionalGeneration is listed by the pinned runtime (transformers 5.19.0 image-text-to-text types)."
