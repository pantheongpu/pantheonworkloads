name: sface-face-embedding
description: "SFace face-embedding network (OpenCV Zoo, Apache-2.0): embedding of an aligned astronaut face, its mirror image and a non-face."
kind: functional
runtime: onnxruntime
runtime_version: "onnxruntime 1.30.0 (PyPI; CPU wheel on cpu, onnxruntime-gpu on gpu)"
targets: [cpu, gpu]
compare: tolerance
tolerance: {abs: 0.0, rel: 0.0, fields: {embedding_dim: {abs: 0, rel: 0}, embedding_norm: {abs: 0.1, rel: 0}, embedding_head: {abs: 0.05, rel: 0}, cosine_face_vs_mirrored: {abs: 0.01, rel: 0}, cosine_face_vs_cat: {abs: 0.02, rel: 0}}}
timeout_s: 900
model:
  id: opencv/opencv_zoo models/face_recognition_sface/face_recognition_sface_2021dec.onnx
  revision: "opencv/opencv_zoo commit 47534e27c9851bb1128ccc0102f1145e27f23f98; face_recognition_sface_2021dec.onnx sha256 0ba9fbfa01b5270c96627c4ef784da859931e02f04419c829e83484087c34e79 (= its git-LFS oid)"
  licence: Apache-2.0   # models/face_recognition_sface/LICENSE (Apache License 2.0 text) and its README "License" section ("All files in this directory are licensed under Apache 2.0 License"), read at that commit
  source_url: https://github.com/opencv/opencv_zoo/tree/main/models/face_recognition_sface
notes: >
  Nothing is committed: weights and images are fetched at run time and checked against model.sha256
  (tools/ort_assets.py). Pre- and post-processing are re-written in tools/ort_vision.py from the model's
  documented usage and never use OpenCV's dnn module, so the same onnxruntime session runs on every target. No
  sim: targets (onnxruntime on pantheonsim is not shown to work). The reference was recorded on the cpu target
  only (onnxruntime CPU provider, 1 thread); the tolerances below are reasoned, not measured on any GPU: a GPU
  provider may use TF32 or different reduction orders, which moves float outputs by roughly 1e-3 relative.
  Input: the astronaut face aligned to 112x112 with five fixed landmarks (the YuNet output on that image,
  written into tools/ort_vision.py so this workload does not depend on a second model), a least-squares
  similarity transform onto the ArcFace template (re-written; its crop differs from OpenCV's alignCrop by
  0.0005 grey levels on average and its embedding has cosine 1.0 to OpenCV's), RGB 0..255. Output: embedding
  length (exact), its L2 norm (abs 0.1), the first 8 values (abs 0.05) and cosine similarities of the
  embedding to the mirrored face and to a 112x112 resize of the cat image (abs 0.01 and 0.02). The cat is not
  a face: that cosine only shows the network separates unrelated inputs, not recognition accuracy. One face
  only, so no identification claim is made. Test images are the scikit-image sample images astronaut.png (NASA
  photo, 'no known copyright restrictions, released into the public domain'), chelsea.png and coffee.png ('CC0
  by the photographer'), read from the docstrings of skimage/data/_fetchers.py at scikit-image tag v0.22.0
  (commit 441fe68b95a86d4ae2a351311a0c39a4232b6521; the repo itself is BSD-3-Clause); they are fetched at run
  time and never committed.
