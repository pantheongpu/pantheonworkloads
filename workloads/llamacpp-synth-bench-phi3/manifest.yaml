name: llamacpp-synth-bench-phi3
description: llama-bench pp/tg tokens/s on a seeded random-weight phi3 GGUF, size m, Q4_K_M by default (not a pretrained
  model).
kind: benchmark
runtime: llama.cpp
runtime_version: llama.cpp b11447 (da263e7275dfbaeefcd61504eaa4fd5247540e11)
targets:
- cpu
- gpu
timeout_s: 7200
model:
  id: pantheonworkloads synthetic random-weight phi3 GGUF (m; Q4_K_M; NOT a pretrained model)
  revision: synth-gen1-seed20260501
  licence: Apache-2.0 (generated by this repository's generator from seeded random numbers; no third-party weights,
    vocabulary or text)
  source_url: https://github.com/pantheongpu/pantheonworkloads/blob/main/tools/llamacpp/synth_gguf.py
notes: |-
  These are RANDOM-WEIGHT models for kernel and graph coverage: seeded pseudo-random numbers in the tensor shapes of an architecture. They are NOT the quality or behaviour of any named pretrained model, and nothing here says how Llama, Mistral, Mixtral, Qwen2, Gemma or Phi-3 models perform.
  Real targets only: bin/pw refuses --bench for sim: targets. llama-bench -o json on a seeded random-weight phi3 GGUF made by tools/llamacpp/synth_gguf.py and quantised with llama-quantize; metrics pp<N>_tokens_per_s and tg<M>_tokens_per_s (default pp512, tg128). The recorded model is the default size m (see `python3 tools/llamacpp/synth_gguf.py --list`) at Q4_K_M; PW_SYNTH_SIZE (tiny, s, m, l, xl) and PW_SYNTH_QUANT select others, but a record always carries this manifest's model pointer, so only record with the defaults. The larger sizes pad the vocabulary to 32000 so the output layer is realistic. Phi-3 architecture: fused QKV projection (attn_qkv) and a fused gate+up projection (ffn_up with 2*n_ff rows), SwiGLU, RoPE base 1e4.
  NOT YET RUN on any GPU: bench/ has no record for it. AMD devices are not auto-detected: pass --device. See docs/llamacpp-synth.md and docs/llamacpp.md.
