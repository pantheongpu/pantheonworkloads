  source_url: https://huggingface.co/Qwen/Qwen-Image-2.1
notes: "VERIFIED ON NVIDIA L40S 48 GB (model catalog, stage 2a, Tier B; sm_89): reference recorded and identical in 3 further runs. Run on one AWS g6e.xlarge (NVIDIA L40S, driver 595.91.07, 2026-10-10) with torch 2.14.1+cu130, transformers 5.19.0, diffusers 0.41.0, bfloat16, whole model on the one card. First run: QwenImage21Pipeline.__call__() has no guidance_scale argument (it takes true_cfg_scale, off by default: the diffusers example calls it with neither), so the workload now passes no guidance and uses the pipeline default (no classifier-free guidance); then the 4-channel (RGBA) output could not be reshaped, so the statistics composite it over white as the pipeline does for its own vision encoder. Statistics-only output (channel mean and std, 8x8 block means, gradients, frame change) recorded with bin/pw record --target gpu, then compared (abs tolerance in the manifest, unchanged) in 3 further bin/pw run passes; the generated pixels were bit-identical between runs on this card, so the tolerance has still been measured only against itself. The informational pixel hash was 799339a67dd0d5e3 in every run. Provenance of the pins, read before the run: What was read (2026-10-09, public Hugging Face API and raw files, no credentials): commit, file names, sizes and LFS sha256 of the 7 pinned file(s) (model.sha256, Hub oids, verified on every run). Licence: Qwen Research License. Read 2026-10-09 from the Hub without credentials: Qwen/Qwen-Image-2.1@d26bb612; card license: other, license_name: qwen-research, license_link: LICENSE; LICENSE begins 'Qwen RESEARCH LICENSE AGREEMENT Qwen RESEARCH LICENSE AGREEMENT Release Date: September 20'; card licence section: 'This model is licensed under the [Qwen Research License Agreement](./LICENSE).'. RESTRICTED: Qwen Research License is a custom, non-OSI or use-based licence (rule in docs/model-registry.md), so the workload is excluded from default selections (docs/manifest.md); name it to run it, and accept the licence yourself. Hardware: requires 1 x 40 GiB (single node); weights 30.8 GiB; max(16.3 largest component, 30.8/1) + 6 = 36.8 GiB per GPU; smallest class holding it at 98% usable: 40 GiB; 1 x 40. The hardware margins are formula values; measured memory is stated above. Task: one image from a fixed prompt and seed (30 steps, guidance 4.0); the output is statistics (channel mean/std, 8x8 block means, gradients), never pixels, with an abs tolerance that is a guess until two GPUs have been compared. Weights are loaded bf16; with more than one GPU diffusers' device_map=balanced places whole components, so the largest component must fit one GPU. Architecture QwenImage21Pipeline is listed by the pinned runtime (diffusers 0.41.0 pipelines). Still not verified: other cards (the abs tolerance is still a guess for cross-card comparison), other torch/diffusers versions."
