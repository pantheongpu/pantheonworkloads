name: qwen-image-2p1-diffusers
description: "Qwen-Image-2.1 (diffusers) on a fixed input; the result is compared with a tolerance."
kind: functional
runtime: pytorch
targets: [gpu]
compare: tolerance
tolerance:
  abs: 0.03
  rel: 0.0
timeout_s: 3970
restricted: true
requires:
  gpus: 1
  gpu_memory_gb: 40
  notes: "weights 30.8 GiB; max(16.3 largest component, 30.8/1) + 6 = 36.8 GiB per GPU; smallest class holding it at 98% usable: 40 GiB; 1 x 40"
