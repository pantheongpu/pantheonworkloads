name: flux1-schnell-bench
description: "FLUX.1-schnell (unsloth mirror of the gated official repo): throughput and peak GPU memory (diffusers)."
kind: benchmark
runtime: pytorch
targets: [gpu]
timeout_s: 7952
requires:
  gpus: 1
  gpu_memory_gb: 40
  notes: "weights 31.4 GiB; max(22.1 largest component, 31.4/1) + 6 = 37.4 GiB per GPU; smallest class holding it at 98% usable: 40 GiB; 1 x 40"
model:
  id: "unsloth/FLUX.1-schnell (diffusers; 7 pinned weights file(s), as stored)"
  revision: "9df3faa7ae3b6ddf0b2b69bb78616372897cc65c (HF commit); the weights files are pinned by sha256 in model.sha256 and verified on every run"
  licence: "Apache-2.0"
  source_url: https://huggingface.co/unsloth/FLUX.1-schnell
notes: "VERIFIED ON NVIDIA L40S 48 GB (model catalog, stage 2a, Tier B; sm_89): 2.252 s per generation, peak 36.3 GB (medians of 5 repeats). Run on one AWS g6e.xlarge (NVIDIA L40S, driver 595.91.07, 2026-10-10) with torch 2.14.1+cu130, transformers 5.19.0, diffusers 0.41.0, bfloat16, whole model on the one card. seconds_per_generation and steps_per_s are the mean of 1 timed generation per repeat after one warm-up generation (PW_DIFFUSION_RUNS=1), 5 repeats; 2.252 s per generation (spread 2.251 to 2.252), 1.776 steps/s, peak GPU memory 36.3 GB (torch max_memory_allocated). Recorded from a clean checkout at repo commit 454bae3d (repo_dirty false). Functional twin: flux1-schnell-diffusers. Provenance of the pins, read before the run: What was read (2026-10-09, public Hugging Face API and raw files, no credentials): commit, file names, sizes and LFS sha256 of the 7 pinned file(s) (model.sha256, Hub oids, verified on every run). Licence: Apache-2.0. Read 2026-10-09 from the Hub without credentials: black-forest-labs/FLUX.1-schnell@741f7c3c; card license: apache-2.0; GATED (auto): only the API tags were readable | downloaded repository unsloth/FLUX.1-schnell@9df3faa7; card license: apache-2.0; NOTICE begins 'The FLUX.1 [dev] Model is licensed by Black Forest Labs Inc. under the FLUX.1 [dev] Non-Co'; its card carries a licence agreement text: False. Hardware: requires 1 x 40 GiB (single node); weights 31.4 GiB; max(22.1 largest component, 31.4/1) + 6 = 37.4 GiB per GPU; smallest class holding it at 98% usable: 40 GiB; 1 x 40. The hardware margins are formula values; measured memory is stated above. Task: one image from a fixed prompt and seed (4 steps, guidance 0.0); the output is statistics (channel mean/std, 8x8 block means, gradients), never pixels, with an abs tolerance that is a guess until two GPUs have been compared. Weights are loaded bf16; with more than one GPU diffusers' device_map=balanced places whole components, so the largest component must fit one GPU. Bench mode of the same script: metrics are throughput and peak memory after warm-up; model load excluded. Architecture FluxPipeline is listed by the pinned runtime (diffusers 0.41.0 pipelines)."
