name: chatterbox-bench
description: "Chatterbox (Resemble AI): throughput and peak GPU memory (tts)."
kind: benchmark
runtime: pytorch
targets: [gpu]
timeout_s: 7270
requires:
  gpus: 1
  gpu_memory_gb: 10
  notes: "weights 3.0 GiB; 3.0/1*1.1 + 4 = 7.3 GiB per GPU; smallest class holding it at 98% usable: 10 GiB; 1 x 10"
model:
  id: "ResembleAI/chatterbox (tts; 4 pinned weights file(s), as stored)"
  revision: "5bb1f6ee58e50c3b8d408bc82a6d3740c2db6e18 (HF commit); the weights files are pinned by sha256 in model.sha256 and verified on every run"
  licence: "MIT"
  source_url: https://huggingface.co/ResembleAI/chatterbox
notes: "VERIFIED ON NVIDIA A10G (model catalog, stage 2a, 2026-10-10): first real run on NVIDIA A10G (one on-demand g5.2xlarge, 22 GiB, driver 595.91.07, Ubuntu 22.04); the functional twin `chatterbox-pytorch` passed there. Benchmark recorded at 5 repeats: audio_seconds_per_s 1.22 (median of 5 repeats, bench/chatterbox-bench/20261010T061228Z-nvidia-a10g.json). Software: torch 2.6.0, transformers 5.2.0, diffusers 0.29.0, numpy 1.26.4. Own venv (PW_VENV_NAME=chatterbox, PW_TORCH_ANY_CUDA=1): chatterbox-tts 0.1.7 pins torch 2.6.0 (its cu124 wheel ran fine on the A10G with driver 595), numpy 1.26.4, transformers 5.2.0 and safetensors 0.5.3, so it cannot share the stack. Needs setuptools==80.10.2: resemble-perth imports pkg_resources, which setuptools 81 and later removed, and without it perth.PerthImplicitWatermarker is None ('TypeError: NoneType object is not callable'). The clip is 2.24 s of audio, reported rounded to 2.0 s; the sampling is seeded and the result was identical in all 4 runs, but it can depend on the library stack. Provenance, written from Hub metadata on 2026-10-09 before this run: What was read (2026-10-09, public Hugging Face API and raw files, no credentials): commit, file names, sizes and LFS sha256 of the 4 pinned file(s) (model.sha256, Hub oids, verified on every run). Licence: MIT. Read 2026-10-09 from the Hub without credentials: ResembleAI/chatterbox@5bb1f6ee; card license: mit. Hardware: requires 1 x 10 GiB (single node); weights 3.0 GiB; 3.0/1*1.1 + 4 = 7.3 GiB per GPU; smallest class holding it at 98% usable: 10 GiB; 1 x 10. These margins were assumptions; this workload ran within them on one 22.5 GiB A10G. Task: synthesise one fixed sentence; the waveform is checked (finite, 1 s or longer, not silent), output = duration rounded to 0.5 s and the RMS level, abs tolerance 0.03. The generator is sampled, so this is a plausibility check, not a regression test of the audio. Bench mode of the same script: metrics are throughput and peak memory after warm-up; model load excluded."
