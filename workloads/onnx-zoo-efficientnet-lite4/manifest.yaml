name: onnx-zoo-efficientnet-lite4
description: "ONNX model zoo EfficientNet-Lite4-11 classifies the zoo's own preprocessed test image with onnxruntime."
kind: functional
runtime: onnxruntime
runtime_version: "onnxruntime 1.30.0 (PyPI; CPU wheel on cpu, onnxruntime-gpu on gpu)"
targets: [cpu, gpu]
compare: tolerance
tolerance: {abs: 0.0, rel: 0.0, fields: {top_logits: {abs: 0.01, rel: 0.001}}}
timeout_s: 900
model:
  id: onnx/models validated/vision/classification/efficientnet-lite4/model/efficientnet-lite4-11.onnx
  revision: "onnx/models commit c5cae0f1942c8d7727372c7b1f6b485aa39e4421; efficientnet-lite4-11.onnx sha256 d111689907c06eea7c82e4833ddef758da6453b9d4cf60b7e99ca05c7cbd9c12 (= its git-LFS oid)"
  licence: MIT   # validated/vision/classification/efficientnet-lite4/README.md "License" section ("MIT License") at that commit; the onnx/models repo LICENSE is Apache-2.0
  source_url: https://github.com/onnx/models/tree/main/validated/vision/classification/efficientnet-lite4
notes: >
  Nothing is committed: weights and images are fetched at run time and checked against model.sha256
  (tools/ort_assets.py). Pre- and post-processing are re-written in tools/ort_vision.py from the model's
  documented usage and never use OpenCV's dnn module, so the same onnxruntime session runs on every target. No
  sim: targets (onnxruntime on pantheonsim is not shown to work). The reference was recorded on the cpu target
  only (onnxruntime CPU provider, 1 thread); the tolerances below are reasoned, not measured on any GPU: a GPU
  provider may use TF32 or different reduction orders, which moves float outputs by roughly 1e-3 relative.
  Input and expected output: test_data_set_0 in the zoo's efficientnet-lite4-11.tar.gz (its top directory is
  efficientnet-lite4/; NHWC float tensor); the run also fails if the output differs from the zoo's own by more
  than 1e-3. The network ends in a softmax, so 'top_logits' holds probabilities and only classes with
  probability >= 1e-3 are listed (ranks among near-zero probabilities are numerical noise): here class 388
  with 0.999. The README's licence section names the licence only (no licence text file sits beside the
  model); the model is a TensorFlow-to-ONNX conversion of EfficientNet-Lite4 trained on ImageNet, and nothing
  is said about that data's terms.
