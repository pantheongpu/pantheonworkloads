name: chronos-t5-large-bench
description: "Chronos T5 Large: throughput and peak GPU memory (timeseries)."
kind: benchmark
runtime: pytorch
targets: [gpu]
timeout_s: 7230
requires:
  gpus: 1
  gpu_memory_gb: 10
  notes: "weights 1.3 GiB; 1.3/1*1.1 + 4 = 5.5 GiB per GPU; smallest class holding it at 98% usable: 10 GiB; 1 x 10"
model:
  id: "amazon/chronos-t5-large (timeseries; 1 pinned weights file(s), as stored)"
  revision: "0e46c9c7e2e9f74b53db0617fdfcfe42a413e54a (HF commit); the weights files are pinned by sha256 in model.sha256 and verified on every run"
  licence: "Apache-2.0"
  source_url: https://huggingface.co/amazon/chronos-t5-large
notes: "WRITTEN, NEVER RUN: nothing in this workload has been executed; no weights were downloaded and no GPU was used. What was read (2026-10-09, public Hugging Face API and raw files, no credentials): commit, file names, sizes and LFS sha256 of the 1 pinned file(s) (model.sha256, Hub oids, verified on every run). Licence: Apache-2.0. Read 2026-10-09 from the Hub without credentials: amazon/chronos-t5-large@0e46c9c7; card license: apache-2.0; card licence section: 'This project is licensed under the Apache-2.0 License.'. Hardware: requires 1 x 10 GiB (single node); weights 1.3 GiB; 1.3/1*1.1 + 4 = 5.5 GiB per GPU; smallest class holding it at 98% usable: 10 GiB; 1 x 10. These margins are assumptions, not measurements. Task: 24-step forecast of a synthetic seasonal series made with numpy; the run fails when the forecast does not follow the season (correlation >= 0.8). Bench mode of the same script: metrics are throughput and peak memory after warm-up; model load excluded. Architecture T5ForConditionalGeneration is listed by the pinned runtime (transformers 5.19.0 model types). Not verified: that the pinned library versions load this checkpoint, the output, the tolerances, speed, memory. No reference.json, no bench record."
