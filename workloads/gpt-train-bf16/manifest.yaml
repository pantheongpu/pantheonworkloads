name: gpt-train-bf16
description: 20 AdamW training steps of a tiny character-level GPT in bf16 autocast; the 20 losses are compared.
kind: functional
runtime: pytorch
targets: [cpu, gpu, "sim:nvidia/*", "sim:amd/*"]
compare: tolerance
tolerance: {abs: 2.0e-2, rel: 0.0}
timeout_s: 3600
model:
  id: gpt-train-tiny (defined in workloads/_shared/gpt_train.py; no pretrained weights)
  revision: workloads/_shared/gpt_train.py at this repository's commit
  licence: Apache-2.0       # this repository's own code (LICENSE); design follows nanoGPT (MIT), see docs/models.md
  source_url: https://github.com/karpathy/nanoGPT
notes: >
  2 layers, 2 heads, 32 wide, 32 tokens of context, batch 8, 1,212 characters of checked-in text
  (workloads/_shared/data/tinytext.txt), seed 1337, AdamW (lr 3e-3, weight decay 0.1 on matrices),
  gradient clipping at 1.0, no dropout. The model is initialised and the batches are drawn on the
  CPU, so every target starts from the same weights and data; TF32 is off.
  bf16 means torch.autocast(bfloat16): matmuls and attention in bf16, parameters, optimizer state and
  the loss in fp32. bf16 keeps 8 bits of mantissa (relative step 3.9e-3), so it is compared with a
  looser bound. Tolerance: on the CPU backend the bf16 losses differ by 2.3e-4 between 1 and 4
  threads and by up to 6.0e-3 from the fp32 run; a GPU's bf16 kernels round and accumulate
  differently again, so the bound is abs 2e-2 (3x the fp32 gap), against a loss that falls by 0.6
  over the run. Exits 77 where the target has no bf16 (a GPU for which torch reports
  is_bf16_supported(including_emulation=False) False, for example NVIDIA Turing).
  Reference recorded on cpu (torch 2.13.0 from conda-forge), not on a GPU. Run on the
  simulated A100, L4, H100, B200 and RTX 5090 (torch 2.14.1+cu130): the 20 losses are within 1.5e-3 to
  2.7e-3 of the reference, 7x to 13x inside the tolerance (docs/sim-validation.md). Not run on a
  physical GPU.
