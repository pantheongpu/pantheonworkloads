name: whisper-cpp-tiny-en
description: whisper.cpp transcribes an 11 s clip with the tiny.en model (CPU, CUDA or HIP build).
kind: functional
runtime: whisper.cpp
targets: [cpu, gpu]
compare: exact
timeout_s: 1800
model:
  id: ggerganov/whisper.cpp ggml-tiny.en.bin   # OpenAI Whisper tiny.en converted to ggml by whisper.cpp
  revision: "ggerganov/whisper.cpp HF commit 5359861c739e955e79d9a303bcbc70fb988958b1; ggml-tiny.en.bin sha256 921e4cf8686fdd993dcd081a5da5b6c365bfde1162e72b08d75ac75289920b1f (sha1 c78c86eb1a8faa21b369bcd33207cc90d64ae9df, as whisper.cpp v1.9.5 models/README.md lists)"
  licence: MIT          # read 2026-10-08: card front matter of ggerganov/whisper.cpp at that commit (license: mit) and openai/whisper LICENSE (MIT, Copyright (c) 2022 OpenAI)
  source_url: https://huggingface.co/ggerganov/whisper.cpp
notes: >
  Runtime: whisper.cpp tag v1.9.5 (commit d1be6fde11ac6e0407606b4e42fe72d34add8037, MIT), built by
  tools/build-whisper-cpp.sh (CPU by default; cuda/hip via PW_WHISPER_BACKEND, hip needs PW_HIP_ARCH).
  Nothing is committed: the model and the clip are fetched at run time and checked against pinned
  checksums (tools/whisper-assets.sh). Audio: samples/jfk.wav from the whisper.cpp repo at that commit
  (sha256 59dfb9a4...). The spoken words are from a 1961 US presidential address (a US federal-government
  work), but the whisper.cpp repo does NOT state the recording's provenance or licence, so it is not
  committed here and its redistribution status is unverified. Output is the lower-cased transcript with
  punctuation removed, compared exactly with reference.json; in addition the run fails when the word
  error rate against the known text exceeds PW_WHISPER_WER_MAX (0.15). Greedy decoding without
  temperature fallback; CUDA/HIP floating-point differences could still change a word, in which case
  record a reference per backend or loosen the comparison. No sim: targets: not attempted.
  No reference.json unless one was recorded (see the commit that added it for the target).
