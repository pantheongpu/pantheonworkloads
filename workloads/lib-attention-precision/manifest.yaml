name: lib-attention-precision
description: SDPA through the math, memory-efficient, flash and cuDNN backends (causal, GQA, masks, cross lengths), int8/fp8/quantised matmul, TF32, half-precision accumulation and autocast fp16/bf16; model-free.
kind: functional
runtime: pytorch
targets: [cpu, gpu, "sim:nvidia/*", "sim:amd/*"]
compare: tolerance
tolerance:
  abs: 1.0e-4
  rel: 1.0e-3
  fields:
    sdpa_math_fp16_causal: {abs: 5.0e-04, rel: 5.0e-03}
    sdpa_math_fp16_gqa_causal: {abs: 5.0e-04, rel: 5.0e-03}
    sdpa_math_bf16_causal: {abs: 5.0e-03, rel: 5.0e-02}
    sdpa_flash_fp16_plain: {abs: 5.0e-04, rel: 5.0e-03}
    sdpa_flash_fp16_causal: {abs: 5.0e-04, rel: 5.0e-03}
    sdpa_flash_fp16_gqa_causal: {abs: 5.0e-04, rel: 5.0e-03}
    sdpa_flash_fp16_cross_lengths: {abs: 2.0e-04, rel: 5.0e-03}
    sdpa_flash_fp16_head_dim_40: {abs: 5.0e-04, rel: 5.0e-03}
    sdpa_flash_fp16_decode_gqa_kv_cache: {abs: 2.0e-04, rel: 5.0e-03}
    sdpa_flash_bf16_causal: {abs: 5.0e-03, rel: 5.0e-02}
    sdpa_flash_bf16_gqa_causal: {abs: 5.0e-03, rel: 5.0e-02}
    sdpa_backward_flash_fp16: {abs: 1.0e-03, rel: 5.0e-03}
    sdpa_default_dispatch_fp16_causal: {abs: 5.0e-04, rel: 5.0e-03}
    matmul_tf32_enabled: {abs: 2.0e-02, rel: 5.0e-03}
    conv2d_tf32_enabled: {abs: 2.0e-03, rel: 5.0e-03}
    bmm_tf32_enabled: {abs: 2.0e-02, rel: 5.0e-03}
    matmul_fp16_long_k_fp32_accumulate: {abs: 5.0e-02, rel: 5.0e-03}
    matmul_bf16_long_k_fp32_accumulate: {abs: 5.0e-01, rel: 5.0e-02}
    sum_mean_fp16_wide_accumulator: {abs: 5.0e-01, rel: 5.0e-03}
    cumsum_softmax_logsumexp_bf16: {abs: 2.0e-02, rel: 5.0e-02}
    softmax_fp16_large_logits: {abs: 1.0e-04, rel: 5.0e-03}
    weight_only_int8_linear_bf16: {abs: 1.0e-01, rel: 5.0e-02}
    dynamic_quantized_linear: {abs: 1.0e-01, rel: 5.0e-02}
    fp8_scaled_mm_e4m3: {abs: 1.0e-01, rel: 5.0e-02}
    autocast_fp16_linear_dtype_and_value: {abs: 2.0e-03, rel: 5.0e-03}
    autocast_fp16_mlp_chain_with_layer_norm: {abs: 1.0e-03, rel: 5.0e-03}
    autocast_fp16_softmax_and_loss_stay_fp32: {abs: 1.0e-04, rel: 5.0e-03}
    autocast_fp16_conv_bmm_sdpa: {abs: 2.0e-03, rel: 5.0e-03}
    autocast_fp16_backward_keeps_fp32_grads: {abs: 1.0e-04, rel: 5.0e-03}
    autocast_bf16_linear_dtype_and_value: {abs: 1.0e-02, rel: 5.0e-02}
    autocast_bf16_mlp_chain_with_layer_norm: {abs: 1.0e-02, rel: 5.0e-02}
    autocast_bf16_softmax_and_loss_stay_fp32: {abs: 5.0e-04, rel: 5.0e-02}
    autocast_bf16_conv_bmm_sdpa: {abs: 1.0e-02, rel: 5.0e-02}
    autocast_bf16_backward_keeps_fp32_grads: {abs: 1.0e-04, rel: 5.0e-02}
timeout_s: 1800
model: null     # downloads no model
# Ops that a real GPU also has no kernel for although the CPU computes them: the CPU reference holds numbers, a GPU
# reports "unsupported" (bin/pw: a reference number against "unsupported" is a FAIL unless listed here; the mapping
# is target pattern -> keys, see docs/manifest.md).
#  - sdpa_flash_fp32_causal: FlashAttention kernels exist for fp16 and bf16 only ("No available kernel" for fp32 on a GPU).
#  - dynamic_quantized_linear: torch.ao dynamic int8 Linear is a CPU (fbgemm / onednn) path.
#  - fp8_scaled_mm_e4m3: torch._scaled_mm needs fp8 tensor cores (sm_89 and newer): Ampere (a100, rtx30xx) and Turing (t4) lack them.
#  - the flash ops on a t4: FlashAttention needs sm_80 or newer (Turing runs the memory-efficient and math backends).
unsupported_ok:
  "*": [sdpa_flash_fp32_causal, dynamic_quantized_linear]
  "sim:nvidia/a100": [fp8_scaled_mm_e4m3]
  "sim:nvidia/rtx3060": [fp8_scaled_mm_e4m3]
  "sim:nvidia/rtx3080ti": [fp8_scaled_mm_e4m3]
  "sim:nvidia/t4": [fp8_scaled_mm_e4m3, sdpa_flash_fp16_plain, sdpa_flash_fp16_causal, sdpa_flash_fp16_gqa_causal,
                    sdpa_flash_fp16_cross_lengths, sdpa_flash_fp16_head_dim_40, sdpa_flash_fp16_decode_gqa_kv_cache,
                    sdpa_flash_bf16_causal, sdpa_flash_bf16_gqa_causal, sdpa_backward_flash_fp16]
notes: >
  GPU libraries exercised: flash-attention, mem-efficient (cutlass) and cuDNN attention kernels, cuBLASLt int8/fp8, tensor-core TF32/fp16/bf16 paths. Inputs come from CPU generators with fixed seeds (docs/lib-coverage.md);
  TF32 is off except in the ops that turn it on for themselves. Output: per op a checksum, [mean|y|, rms, y at three
  fixed positions] for floats or a count/sum/weighted-sum/head string for integers. An op the backend has no kernel
  for is reported as the string "unsupported" (never skipped), so against a reference with numbers it fails on exactly
  that key. Every run also fails if any op is further from its own float64 CPU result than the op's bound
  (max |error| as a fraction of the result's rms; integer results must be equal). The SDPA backend of each op is pinned with sdpa_kernel([...]); a backend that cannot take the shape or dtype (memory-efficient and cuDNN on the CPU, flash fp32 on GPUs) reports 'unsupported' instead of silently falling back to another backend. Autocast ops also assert the result dtypes the autocast policy promises (CUDA policy for softmax/cross_entropy/layer_norm). fp8 and dynamic-int8 ops are CPU or newer-GPU only.
  Tolerances: default abs 1e-4 / rel 1e-3 for fp32 ops; fp16 and bf16 ops carry their own (fields above): rel 4 eps of the
  dtype, abs 4x the largest checksum deviation measured on the CPU between the dtype run and the float64 run, a 1-thread run
  and a repeat (at least one eps of the checksum's rms). The fp32 ops use under 1% of the default tolerance on the CPU.
  Derivation: `libkernels.py lib-attention-precision --calibrate` (docs/lib-coverage.md). The reference was recorded on the cpu target
  (CPU PyTorch from conda-forge); ops that the CPU cannot run are recorded as "unsupported", so a target whose backend has an op the CPU lacks leaves that key unchecked (bin/pw counts it in the run's detail). Also run on sim:nvidia/{rtx5090, h100, a100, t4} (docs/sim-validation.md); not run on a physical GPU.
