name: wan21-t2v-1p3b-bench
description: "Wan2.1-T2V-1.3B: throughput and peak GPU memory (diffusers)."
kind: benchmark
runtime: pytorch
targets: [gpu]
timeout_s: 7522
requires:
  gpus: 1
  gpu_memory_gb: 40
  notes: "weights 13.5 GiB; max(10.6 largest component, 13.5/1) + 16 = 29.5 GiB per GPU; smallest class holding it at 98% usable: 40 GiB; 1 x 40"
model:
  id: "Wan-AI/Wan2.1-T2V-1.3B-Diffusers (diffusers; 8 pinned weights file(s), stored fp32, loaded bf16)"
  revision: "0fad780a534b6463e45facd96134c9f345acfa5b (HF commit); the weights files are pinned by sha256 in model.sha256 and verified on every run"
  licence: "Apache-2.0"
  source_url: https://huggingface.co/Wan-AI/Wan2.1-T2V-1.3B-Diffusers
notes: "VERIFIED ON NVIDIA L40S 48 GB (model catalog, stage 2a, Tier B; sm_89): 37.377 s per generation, peak 19.09 GB (medians of 5 repeats). Run on one AWS g6e.xlarge (NVIDIA L40S, driver 595.91.07, 2026-10-10) with torch 2.14.1+cu130, transformers 5.19.0, diffusers 0.41.0, bfloat16, whole model on the one card. seconds_per_generation and steps_per_s are the mean of 1 timed generation per repeat after one warm-up generation (PW_DIFFUSION_RUNS=1), 5 repeats; 37.377 s per generation (spread 37.351 to 37.419), 0.803 steps/s, peak GPU memory 19.09 GB (torch max_memory_allocated). Recorded from a clean checkout at repo commit 454bae3d (repo_dirty false). Functional twin: wan21-t2v-1p3b-diffusers. Provenance of the pins, read before the run: What was read (2026-10-09, public Hugging Face API and raw files, no credentials): commit, file names, sizes and LFS sha256 of the 8 pinned file(s) (model.sha256, Hub oids, verified on every run). Licence: Apache-2.0. Read 2026-10-09 from the Hub without credentials: Wan-AI/Wan2.1-T2V-1.3B-Diffusers@0fad780a; card license: apache-2.0. Hardware: requires 1 x 40 GiB (single node); weights 13.5 GiB; max(10.6 largest component, 13.5/1) + 16 = 29.5 GiB per GPU; smallest class holding it at 98% usable: 40 GiB; 1 x 40. The hardware margins are formula values; measured memory is stated above. Task: one video from a fixed prompt and seed (30 steps, guidance 5.0); the output is statistics (channel mean/std, 8x8 block means, gradients, frame-to-frame change), never pixels, with an abs tolerance that is a guess until two GPUs have been compared. Weights are loaded bf16; with more than one GPU diffusers' device_map=balanced places whole components, so the largest component must fit one GPU. Bench mode of the same script: metrics are throughput and peak memory after warm-up; model load excluded. Architecture WanPipeline is listed by the pinned runtime (diffusers 0.41.0 pipelines)."
