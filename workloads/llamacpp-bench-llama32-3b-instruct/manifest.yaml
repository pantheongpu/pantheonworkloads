notes: "llama.cpp itself is MIT (LICENSE read at the pinned commit). Repo and file pinned on 2026-10-08, sha256 = the LFS oid listed by the Hub for that commit, verified on every run. Build and knobs: docs/llamacpp.md. RESTRICTED: Llama 3.2 Community Licence (acceptable-use policy, attribution and 'Built with Llama' terms, 700M-MAU clause; it is not an OSI licence). The official repo meta-llama/Llama-3.2-3B-Instruct is gated (manual approval) and needs a Hugging Face login, which this repo does not have, so its LICENSE.txt could not be read; only its API metadata (license: llama3.2, gated: manual) was. The licence text was read from the community conversion bartowski/Llama-3.2-3B-Instruct-GGUF, which is not gated and whose card front matter carries the full 'LLAMA 3.2 COMMUNITY LICENSE AGREEMENT' (extra_gated_prompt) and states license: llama3.2. This is a third-party conversion (quantized_by bartowski). Accept Meta's terms yourself before using it. Excluded from default selections (docs/manifest.md). Real targets only: bin/pw refuses --bench for sim: targets. Metrics: pp512_tokens_per_s and tg128_tokens_per_s from llama-bench -o json (mean of PW_BENCH_REPS=3 inside llama-bench; bin/pw's --repeat adds outer repeats), -ngl 99, one NVIDIA A10G. AMD devices are not auto-detected: pass --device."
