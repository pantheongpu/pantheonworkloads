name: ltx-video-bench
description: "LTX-Video 0.9.x: throughput and peak GPU memory (diffusers)."
kind: benchmark
runtime: pytorch
targets: [gpu]
timeout_s: 7516
restricted: true
requires:
  gpus: 1
  gpu_memory_gb: 40
  notes: "weights 13.2 GiB; max(8.9 largest component, 13.2/1) + 16 = 29.2 GiB per GPU; smallest class holding it at 98% usable: 40 GiB; 1 x 40"
model:
  id: "Lightricks/LTX-Video (diffusers; 7 pinned weights file(s), stored fp32, loaded bf16)"
  revision: "8984fa25007f376c1a299016d0957a37a2f797bb (HF commit); the weights files are pinned by sha256 in model.sha256 and verified on every run"
  licence: "custom licence (LICENSE file begins 'LTX Video (\"LTXV\") By Lightricks Ltd. (\"Lightricks\") LTXV Op')"
  source_url: https://huggingface.co/Lightricks/LTX-Video
notes: "VERIFIED ON NVIDIA L40S 48 GB (model catalog, stage 2a, Tier B; sm_89): 4.684 s per generation, peak 15.96 GB (medians of 5 repeats). Run on one AWS g6e.xlarge (NVIDIA L40S, driver 595.91.07, 2026-10-10) with torch 2.14.1+cu130, transformers 5.19.0, diffusers 0.41.0, bfloat16, whole model on the one card. seconds_per_generation and steps_per_s are the mean of 1 timed generation per repeat after one warm-up generation (PW_DIFFUSION_RUNS=1), 5 repeats; 4.684 s per generation (spread 4.647 to 4.73), 6.404 steps/s, peak GPU memory 15.96 GB (torch max_memory_allocated). Recorded from a clean checkout at repo commit 454bae3d (repo_dirty false). Functional twin: ltx-video-diffusers. Provenance of the pins, read before the run: What was read (2026-10-09, public Hugging Face API and raw files, no credentials): commit, file names, sizes and LFS sha256 of the 7 pinned file(s) (model.sha256, Hub oids, verified on every run). Licence: custom licence (LICENSE file begins 'LTX Video (\"LTXV\") By Lightricks Ltd. (\"Lightricks\") LTXV Op'). Read 2026-10-09 from the Hub without credentials: Lightricks/LTX-Video@8984fa25; card license: other; LTX-Video-Open-Weights-License-0.X.txt begins 'LTX Video (\"LTXV\") By Lightricks Ltd. (\"Lightricks\") LTXV Open Weights License 0.X License'; ltx-video-2b-v0.9.1.license.txt begins 'LTX Video 0.9.1 (“LTXV”) By Lightricks Ltd. (“Lightricks”) RAIL-M License dated November 2'; ltx-video-2b-v0.9.5.license.txt begins 'LTX Video 2B 0.9.5 (�LTXV�) By Lightricks Ltd. (�Lightricks�) Open RAIL-M License dated Ma'; ltx-video-2b-v0.9.license.txt begins 'LTX Video 0.9 (“LTXV”) By Lightricks Ltd. (“Lightricks”) RAIL-M License dated November 22,'. RESTRICTED: custom licence (LICENSE file begins 'LTX Video (\"LTXV\") By Lightricks Ltd. (\"Lightricks\") LTXV Op') is a custom, non-OSI or use-based licence (rule in docs/model-registry.md), so the workload is excluded from default selections (docs/manifest.md); name it to run it, and accept the licence yourself. Hardware: requires 1 x 40 GiB (single node); weights 13.2 GiB; max(8.9 largest component, 13.2/1) + 16 = 29.2 GiB per GPU; smallest class holding it at 98% usable: 40 GiB; 1 x 40. The hardware margins are formula values; measured memory is stated above. Task: one video from a fixed prompt and seed (30 steps, guidance 3.0); the output is statistics (channel mean/std, 8x8 block means, gradients, frame-to-frame change), never pixels, with an abs tolerance that is a guess until two GPUs have been compared. Weights are loaded bf16; with more than one GPU diffusers' device_map=balanced places whole components, so the largest component must fit one GPU. Bench mode of the same script: metrics are throughput and peak memory after warm-up; model load excluded. Architecture LTXPipeline is listed by the pinned runtime (diffusers 0.41.0 pipelines)."
