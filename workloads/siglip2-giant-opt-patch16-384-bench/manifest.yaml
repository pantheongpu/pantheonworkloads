notes: "VERIFIED ON NVIDIA A10G (model catalog, stage 2a, 2026-10-10): first real run on NVIDIA A10G (one on-demand g5.2xlarge, 22 GiB, driver 595.91.07, Ubuntu 22.04); the functional twin `siglip2-giant-opt-patch16-384-pytorch` passed there. Benchmark recorded at 5 repeats: images_per_s_b1 8.64, peak_gpu_memory_gb 7.54 (median of 5 repeats, bench/siglip2-giant-opt-patch16-384-bench/20261010T070108Z-nvidia-a10g.json). Software: torch 2.14.1+cu130, torchvision 0.29.1+cu130, transformers 5.19.0, diffusers 0.41.0, numpy 2.5.3. Provenance, written from Hub metadata on 2026-10-09 before this run: What was read (2026-10-09, public Hugging Face API and raw files, no credentials): commit, file names, sizes and LFS sha256 of the 2 pinned file(s) (model.sha256, Hub oids, verified on every run). Licence: Apache-2.0. Read 2026-10-09 from the Hub without credentials: google/siglip2-giant-opt-patch16-384@a713301b; card license: apache-2.0. Hardware: requires 1 x 10 GiB (single node); weights 3.5 GiB; 3.5/1*1.1 + 4 = 7.8 GiB per GPU; smallest class holding it at 98% usable: 10 GiB; 1 x 10. These margins were assumptions; this workload ran within them on one 22.5 GiB A10G. Task: head 'siglip2' on scikit-image's public-domain astronaut.png (sha256 pinned, fetched at run time); see workloads/_pytorch/vision.py for the statistics compared. Bench mode of the same script: metrics are throughput and peak memory after warm-up; model load excluded."
