name: llamacpp-synth-quant-lowbit
description: 'llama.cpp on seeded random-weight llama GGUFs (Q1_0, Q2_0, TQ1_0, TQ2_0): greedy token ids, logits,
  perplexity (not a pretrained model).'
kind: functional
runtime: llama.cpp
runtime_version: llama.cpp b11447 (da263e7275dfbaeefcd61504eaa4fd5247540e11)
targets:
- cpu
- gpu
- sim:nvidia/*
- sim:amd/*
compare: tolerance
tolerance:
  abs: 0.0
  rel: 0.0
  fields:
    Q1_0.top1_logit:
      abs: 0.66
      rel: 0.0
    Q1_0.logsumexp:
      abs: 0.66
      rel: 0.0
    Q1_0.ppl:
      abs: 0.0
      rel: 0.05
    Q2_0.top1_logit:
      abs: 0.96
      rel: 0.0
    Q2_0.logsumexp:
      abs: 0.96
      rel: 0.0
    Q2_0.ppl:
      abs: 0.0
      rel: 0.05
    TQ1_0.top1_logit:
      abs: 0.52
      rel: 0.0
    TQ1_0.logsumexp:
      abs: 0.52
      rel: 0.0
    TQ1_0.ppl:
      abs: 0.0
      rel: 0.05
    TQ2_0.top1_logit:
      abs: 0.52
      rel: 0.0
    TQ2_0.logsumexp:
      abs: 0.52
      rel: 0.0
    TQ2_0.ppl:
      abs: 0.0
      rel: 0.05
timeout_s: 3600
model:
  id: pantheonworkloads synthetic random-weight llama GGUF (tiny; Q1_0, Q2_0, TQ1_0, TQ2_0; NOT a pretrained model)
  revision: synth-gen1-seed20260501
  licence: Apache-2.0 (generated by this repository's generator from seeded random numbers; no third-party weights,
    vocabulary or text)
  source_url: https://github.com/pantheongpu/pantheonworkloads/blob/main/tools/llamacpp/synth_gguf.py
notes: |-
  These are RANDOM-WEIGHT models for kernel and graph coverage: seeded pseudo-random numbers in the tensor shapes of an architecture. They are NOT the quality or behaviour of any named pretrained model, and nothing here says how Llama, Mistral, Mixtral, Qwen2, Gemma or Phi-3 models perform.
  Generated by tools/llamacpp/synth_gguf.py (seed 20260501, size tiny, 1024-token generated vocabulary; same seed gives byte-identical files, pinned in models.sha256), quantised with the pinned build's llama-quantize.
  Llama-architecture graph model quantised to Q1_0, Q2_0, TQ1_0, TQ2_0: 1- and 2-bit formats: Q1_0 and Q2_0 block quantisations and the ternary TQ1_0/TQ2_0 types (several have no CUDA/HIP mmq kernel and use the generic dequantise path).
  Per quantisation type the output holds the 6 greedy token ids (compared exactly), the top-1 logit and log-sum-exp of every step and llama-perplexity's PPL on a fixed generated text. Reference recorded on the cpu target. Tolerances are max(class floor, 5 x CPU spread across threads/ubatch/flash-attention/KV type/repacking); a GPU backend's spread was not measurable here. See docs/llamacpp-synth.md.
  Backends and sim: wiring as llamacpp-smollm2-135m (docs/llamacpp.md); the sim: targets have never been run.
