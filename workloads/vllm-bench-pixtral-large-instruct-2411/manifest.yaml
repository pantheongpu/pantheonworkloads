notes: "WRITTEN, NEVER RUN: nothing in this workload has been executed; no weights were downloaded and no GPU was used. What was read (2026-10-09, public Hugging Face API and raw files, no credentials): commit, file names, sizes and LFS sha256 of the 52 pinned file(s) (model.sha256, Hub oids, verified on every run). Licence: Mistral Research License. Read 2026-10-09 from the Hub without credentials: mistralai/Pixtral-Large-Instruct-2411@c1e51f6f; card license: other, license_name: mrl, license_link: https://mistral.ai/licenses/MRL-0.1.md. RESTRICTED: Mistral Research License is a custom, non-OSI or use-based licence (rule in docs/model-registry.md), so the workload is excluded from default selections (docs/manifest.md); name it to run it, and accept the licence yourself. Hardware: requires 4 x 80 GiB (single node); weights 231.2 GiB; (231.2/4 + 6)/0.9 = 70.9 GiB per GPU; smallest class holding it at 98% usable: 80 GiB; 4 x 80. These margins are assumptions, not measurements. Task: `vllm bench throughput` (vLLM v0.30.0) on the verified local snapshot: random dataset, 64 prompts of 128 input and 128 output tokens, --max-model-len 4096, tensor parallel = requires.gpus; metrics requests_per_s, total_tokens_per_s, output_tokens_per_s. Real GPUs only. Not verified: that vLLM v0.30.0 loads this checkpoint on the GPUs it will meet (the config declares architecture None, which the pinned registry lists; Mistral-format repositories carry no config.json, so the architecture was not checked), quantisation kernels for the GPU generation, the output, speed. No reference.json, no bench record."
