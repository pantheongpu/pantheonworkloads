notes: "VERIFIED ON NVIDIA A10G (model catalog, stage 2a, 2026-10-10): first real run on NVIDIA A10G (one on-demand g5.2xlarge, 22 GiB, driver 595.91.07, Ubuntu 22.04); the functional twin `llamacpp-gemma4-12b-it` passed there. Benchmark recorded at 5 repeats: pp512_tokens_per_s 2630.86, tg128_tokens_per_s 59.44 (median of 5 repeats, bench/llamacpp-bench-gemma4-12b-it/20261010T074004Z-nvidia-a10g.json). Software: llama.cpp b11447 (da263e7275dfbaeefcd61504eaa4fd5247540e11), CUDA build for sm_86. Caution: with this workload's raw prompt (no chat template) this checkpoint degenerates ('The capital of France is' gives '011'; longer decodes give '0111111...', on the GPU and on the CPU alike, for four different prompts), unlike the other Gemma 4 GGUFs, which answer ' Paris'. In chat mode it answers sensibly ('<|channel>thought ...'), and the GGUF loader warns that token 212 '</s>' is not control-type. The reference therefore documents determinism, not quality; a chat-template task would test this model better. Provenance, written from Hub metadata on 2026-10-09 before this run: What was read (2026-10-09, public Hugging Face API and raw files, no credentials): commit, file names, sizes and LFS sha256 of the 1 pinned file(s) (model.sha256, Hub oids, verified on every run). Licence: Apache-2.0. Read 2026-10-09 from the Hub without credentials: google/gemma-4-12B-it@707f0a3b; card license: apache-2.0, license_link: https://ai.google.dev/gemma/docs/gemma_4_license | downloaded repository google/gemma-4-12B-it-qat-q4_0-gguf@29d09777; card license: apache-2.0, license_link: https://ai.google.dev/gemma/docs/gemma_4_license; its card carries a licence agreement text: False. Hardware: requires 1 x 15 GiB (single node); weights 6.5 GiB; 6.5/1*1.05 + 3 = 9.8 GiB per GPU; smallest class holding it at 98% usable: 15 GiB; 1 x 15. These margins were assumptions; this workload ran within them on one 22.5 GiB A10G. Task: llama-bench pp512 and tg128 (tools/llamacpp/bench.sh), -ngl 99, layers split over the GPUs llama.cpp sees; metrics pp512_tokens_per_s and tg128_tokens_per_s. Real GPUs only. Build and knobs: docs/llamacpp.md."
