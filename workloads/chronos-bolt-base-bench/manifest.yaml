name: chronos-bolt-base-bench
description: "Chronos-Bolt Base: throughput and peak GPU memory (timeseries)."
kind: benchmark
runtime: pytorch
targets: [gpu]
timeout_s: 7208
requires:
  gpus: 1
  gpu_memory_gb: 10
  notes: "weights 0.4 GiB; 0.4/1*1.1 + 4 = 4.4 GiB per GPU; smallest class holding it at 98% usable: 10 GiB; 1 x 10"
model:
  id: "amazon/chronos-bolt-base (timeseries; 1 pinned weights file(s), as stored)"
  revision: "5d9f166d69f47aef3401367a7b842e78fe97b121 (HF commit); the weights files are pinned by sha256 in model.sha256 and verified on every run"
  licence: "Apache-2.0"
  source_url: https://huggingface.co/amazon/chronos-bolt-base
notes: "VERIFIED ON NVIDIA A10G (model catalog, stage 2a, 2026-10-10): first real run on NVIDIA A10G (one on-demand g5.2xlarge, 22 GiB, driver 595.91.07, Ubuntu 22.04); the functional twin `chronos-bolt-base-pytorch` passed there. Benchmark recorded at 5 repeats: forecasts_per_s_b1 31.09 (median of 5 repeats, bench/chronos-bolt-base-bench/20261010T061512Z-nvidia-a10g.json). Software: torch 2.14.1+cu130, torchvision 0.29.1+cu130, transformers 5.19.0, diffusers 0.41.0, numpy 2.5.3. chronos-forecasting 2.3.2 from requirements-chronos.txt (five small packages added to the shared venv). Provenance, written from Hub metadata on 2026-10-09 before this run: What was read (2026-10-09, public Hugging Face API and raw files, no credentials): commit, file names, sizes and LFS sha256 of the 1 pinned file(s) (model.sha256, Hub oids, verified on every run). Licence: Apache-2.0. Read 2026-10-09 from the Hub without credentials: amazon/chronos-bolt-base@5d9f166d; card license: apache-2.0; card licence section: 'This project is licensed under the Apache-2.0 License.'. Hardware: requires 1 x 10 GiB (single node); weights 0.4 GiB; 0.4/1*1.1 + 4 = 4.4 GiB per GPU; smallest class holding it at 98% usable: 10 GiB; 1 x 10. These margins were assumptions; this workload ran within them on one 22.5 GiB A10G. Task: 24-step forecast of a synthetic seasonal series made with numpy; the run fails when the forecast does not follow the season (correlation >= 0.8). Bench mode of the same script: metrics are throughput and peak memory after warm-up; model load excluded. Architecture ChronosBoltModelForForecasting is listed by the pinned runtime (transformers 5.19.0 model types)."
