name: llamacpp-synth-quant-legacy
description: 'llama.cpp on seeded random-weight llama GGUFs (Q4_0, Q4_1, Q5_0, Q5_1, Q8_0): greedy token ids, logits,
  perplexity (not a pretrained model).'
kind: functional
runtime: llama.cpp
runtime_version: llama.cpp b11447 (da263e7275dfbaeefcd61504eaa4fd5247540e11)
targets:
- cpu
- gpu
- sim:nvidia/*
- sim:amd/*
compare: tolerance
