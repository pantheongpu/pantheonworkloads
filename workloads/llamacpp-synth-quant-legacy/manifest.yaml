  abs: 0.0
  rel: 0.0
  fields:
    Q4_0.top1_logit:
      abs: 0.93
      rel: 0.0
    Q4_0.logsumexp:
      abs: 0.93
      rel: 0.0
    Q4_0.ppl:
      abs: 0.0
      rel: 0.02
    Q4_1.top1_logit:
      abs: 0.64
      rel: 0.0
    Q4_1.logsumexp:
      abs: 0.64
      rel: 0.0
    Q4_1.ppl:
      abs: 0.0
      rel: 0.02
    Q5_0.top1_logit:
      abs: 0.68
      rel: 0.0
    Q5_0.logsumexp:
      abs: 0.68
      rel: 0.0
    Q5_0.ppl:
      abs: 0.0
      rel: 0.01
    Q5_1.top1_logit:
      abs: 0.73
      rel: 0.0
    Q5_1.logsumexp:
      abs: 0.73
