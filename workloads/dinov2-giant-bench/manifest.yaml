name: dinov2-giant-bench
description: "DINOv2 giant: throughput and peak GPU memory (vision)."
kind: benchmark
runtime: pytorch
targets: [gpu]
timeout_s: 7250
requires:
  gpus: 1
  gpu_memory_gb: 10
  notes: "weights 2.1 GiB; 2.1/1*1.1 + 4 = 6.3 GiB per GPU; smallest class holding it at 98% usable: 10 GiB; 1 x 10"
model:
  id: "facebook/dinov2-giant (vision; 1 pinned weights file(s), as stored)"
  revision: "611a9d42f2335e0f921f1e313ad3c1b7178d206d (HF commit); the weights files are pinned by sha256 in model.sha256 and verified on every run"
  licence: "Apache-2.0"
  source_url: https://huggingface.co/facebook/dinov2-giant
notes: "VERIFIED ON NVIDIA A10G (model catalog, stage 2a, 2026-10-10): first real run on NVIDIA A10G (one on-demand g5.2xlarge, 22 GiB, driver 595.91.07, Ubuntu 22.04); the functional twin `dinov2-giant-pytorch` passed there. Benchmark recorded at 5 repeats: images_per_s_b1 10.81, peak_gpu_memory_gb 4.59 (median of 5 repeats, bench/dinov2-giant-bench/20261010T062534Z-nvidia-a10g.json). Software: torch 2.14.1+cu130, torchvision 0.29.1+cu130, transformers 5.19.0, diffusers 0.41.0, numpy 2.5.3. Provenance, written from Hub metadata on 2026-10-09 before this run: What was read (2026-10-09, public Hugging Face API and raw files, no credentials): commit, file names, sizes and LFS sha256 of the 1 pinned file(s) (model.sha256, Hub oids, verified on every run). Licence: Apache-2.0. Read 2026-10-09 from the Hub without credentials: facebook/dinov2-giant@611a9d42; card license: apache-2.0. Hardware: requires 1 x 10 GiB (single node); weights 2.1 GiB; 2.1/1*1.1 + 4 = 6.3 GiB per GPU; smallest class holding it at 98% usable: 10 GiB; 1 x 10. These margins were assumptions; this workload ran within them on one 22.5 GiB A10G. Task: head 'dino' on scikit-image's public-domain astronaut.png (sha256 pinned, fetched at run time); see workloads/_pytorch/vision.py for the statistics compared. Bench mode of the same script: metrics are throughput and peak memory after warm-up; model load excluded. Architecture Dinov2Model is listed by the pinned runtime (transformers 5.19.0 model types)."
