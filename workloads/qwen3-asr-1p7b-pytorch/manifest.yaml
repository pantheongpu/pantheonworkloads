name: qwen3-asr-1p7b-pytorch
description: "Qwen3-ASR-1.7B (asr) on a fixed input; the result is compared with a tolerance."
kind: functional
runtime: pytorch
targets: [gpu]
compare: tolerance
tolerance:
  abs: 0.0
  rel: 0.0
  fields:
    text: {wer: 0.1}
timeout_s: 3652
requires:
  gpus: 1
  gpu_memory_gb: 10
  notes: "weights 4.4 GiB; 4.4/1*1.1 + 4 = 8.8 GiB per GPU; smallest class holding it at 98% usable: 10 GiB; 1 x 10"
model:
  id: "Qwen/Qwen3-ASR-1.7B (asr; 2 pinned weights file(s), as stored)"
  revision: "7278e1e70fe206f11671096ffdd38061171dd6e5 (HF commit); the weights files are pinned by sha256 in model.sha256 and verified on every run"
  licence: "Apache-2.0"
  source_url: https://huggingface.co/Qwen/Qwen3-ASR-1.7B
notes: "VERIFIED ON NVIDIA A10G (model catalog, stage 2a, 2026-10-10): first real run. Reference recorded with `bin/pw record --target gpu` on NVIDIA A10G (one on-demand g5.2xlarge, 22 GiB, driver 595.91.07, Ubuntu 22.04) and identical in 3 further consecutive runs. Software: torch 2.14.1+cu130, torchvision 0.29.1+cu130, transformers 5.19.0, diffusers 0.41.0, numpy 2.5.3. Changed in this run: the first run failed. The transformers pipeline cannot drive this model (beam search by default, the audio features arrive as input_ids), and Qwen's checkpoint is in the layout of its own qwen-asr package (config nested under thinker_config, encoder model_type qwen3_asr_audio_encoder, weights named thinker.*), which transformers 5.19.0's native Qwen3ASRForConditionalGeneration loads as every weight UNEXPECTED (a random model, then a shape error). asr.py now loads it with that config and a key mapping (708 of 708 tensors match) and decodes greedily through the processor's chat template; the transcript is exact (WER 0.000). requirements-asr.txt is its requirements file. Provenance, written from Hub metadata on 2026-10-09 before this run: What was read (2026-10-09, public Hugging Face API and raw files, no credentials): commit, file names, sizes and LFS sha256 of the 2 pinned file(s) (model.sha256, Hub oids, verified on every run). Licence: Apache-2.0. Read 2026-10-09 from the Hub without credentials: Qwen/Qwen3-ASR-1.7B@7278e1e7; card license: apache-2.0. Hardware: requires 1 x 10 GiB (single node); weights 4.4 GiB; 4.4/1*1.1 + 4 = 8.8 GiB per GPU; smallest class holding it at 98% usable: 10 GiB; 1 x 10. These margins were assumptions; this workload ran within them on one 22.5 GiB A10G. Task: transcribe the 11 s clip jfk.wav of whisper.cpp (pinned commit and sha256, fetched at run time; its provenance is stated nowhere, see docs/models.md); output = the transcript with only lower-case letters, compared by word error rate (<= 0.1 against a reference) and checked against the known words (<= 0.15) on every run. Architecture Qwen3ASRForConditionalGeneration is listed by the pinned runtime (transformers 5.19.0 model types)."
