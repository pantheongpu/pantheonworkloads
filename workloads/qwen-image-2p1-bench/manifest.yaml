name: qwen-image-2p1-bench
description: "Qwen-Image-2.1: throughput and peak GPU memory (diffusers)."
kind: benchmark
runtime: pytorch
targets: [gpu]
timeout_s: 7940
restricted: true
requires:
  gpus: 1
  gpu_memory_gb: 40
  notes: "weights 30.8 GiB; max(16.3 largest component, 30.8/1) + 6 = 36.8 GiB per GPU; smallest class holding it at 98% usable: 40 GiB; 1 x 40"
model:
  id: "Qwen/Qwen-Image-2.1 (diffusers; 7 pinned weights file(s), as stored)"
  revision: "d26bb61231c349cf6b7896fa83353113880e1ba3 (HF commit); the weights files are pinned by sha256 in model.sha256 and verified on every run"
  licence: "Qwen Research License"
  source_url: https://huggingface.co/Qwen/Qwen-Image-2.1
notes: "VERIFIED ON NVIDIA L40S 48 GB (model catalog, stage 2a, Tier B; sm_89): 12.068 s per generation, peak 39.53 GB (medians of 5 repeats). Run on one AWS g6e.xlarge (NVIDIA L40S, driver 595.91.07, 2026-10-10) with torch 2.14.1+cu130, transformers 5.19.0, diffusers 0.41.0, bfloat16, whole model on the one card. seconds_per_generation and steps_per_s are the mean of 1 timed generation per repeat after one warm-up generation (PW_DIFFUSION_RUNS=1), 5 repeats; 12.068 s per generation (spread 12.037 to 12.148), 2.486 steps/s, peak GPU memory 39.53 GB (torch max_memory_allocated). Recorded from a clean checkout at repo commit 454bae3d (repo_dirty false). Functional twin: qwen-image-2p1-diffusers. Provenance of the pins, read before the run: What was read (2026-10-09, public Hugging Face API and raw files, no credentials): commit, file names, sizes and LFS sha256 of the 7 pinned file(s) (model.sha256, Hub oids, verified on every run). Licence: Qwen Research License. Read 2026-10-09 from the Hub without credentials: Qwen/Qwen-Image-2.1@d26bb612; card license: other, license_name: qwen-research, license_link: LICENSE; LICENSE begins 'Qwen RESEARCH LICENSE AGREEMENT Qwen RESEARCH LICENSE AGREEMENT Release Date: September 20'; card licence section: 'This model is licensed under the [Qwen Research License Agreement](./LICENSE).'. RESTRICTED: Qwen Research License is a custom, non-OSI or use-based licence (rule in docs/model-registry.md), so the workload is excluded from default selections (docs/manifest.md); name it to run it, and accept the licence yourself. Hardware: requires 1 x 40 GiB (single node); weights 30.8 GiB; max(16.3 largest component, 30.8/1) + 6 = 36.8 GiB per GPU; smallest class holding it at 98% usable: 40 GiB; 1 x 40. The hardware margins are formula values; measured memory is stated above. Task: one image from a fixed prompt and seed (30 steps, guidance 4.0); the output is statistics (channel mean/std, 8x8 block means, gradients), never pixels, with an abs tolerance that is a guess until two GPUs have been compared. Weights are loaded bf16; with more than one GPU diffusers' device_map=balanced places whole components, so the largest component must fit one GPU. Bench mode of the same script: metrics are throughput and peak memory after warm-up; model load excluded. Architecture QwenImage21Pipeline is listed by the pinned runtime (diffusers 0.41.0 pipelines)."
