name: pixtral-12b-2409-pytorch
description: "Pixtral-12B-2409 (HF-format conversion) (bf16) describes a fixed public-domain image with greedy decoding."
kind: functional
runtime: pytorch
targets: [gpu]
compare: exact
timeout_s: 3883
requires:
  gpus: 1
  gpu_memory_gb: 40
  notes: "weights 23.6 GiB; 23.6/1*1.1 + 4 = 30.0 GiB per GPU; smallest class holding it at 98% usable: 40 GiB; 1 x 40"
model:
  id: "mistral-community/pixtral-12b (vlm; 6 pinned weights file(s), as stored)"
  revision: "c2756cbbb9422eba9f6c5c439a214b0392dfc998 (HF commit); the weights files are pinned by sha256 in model.sha256 and verified on every run"
  licence: "Apache-2.0"
  source_url: https://huggingface.co/mistral-community/pixtral-12b
notes: "VERIFIED ON NVIDIA L40S 48 GB (model catalog, stage 2a, Tier B; sm_89): reference recorded and identical in 3 further runs. Run on one AWS g6e.xlarge (NVIDIA L40S, driver 595.91.07, 2026-10-10) with torch 2.14.1+cu130, transformers 5.19.0, diffusers 0.41.0, bfloat16, whole model on the one card. First run: the generic image+text chat message and processor worked unchanged, but the one-sentence description hit an exact bf16 tie (top-1 and top-2 logits equal, gap 0) at the 4th generated token and a 0.0625 gap in fp16, so the prompt is now 'What color is the flag on the left? Answer with one word.' (the model answers 'Red, white and blue.' with a top1-top2 gap of 1.0 at every step in bf16, floor 0.5; five prompts were compared on the card, see docs/model-registry.md). Greedy text and token ids compared exactly; every decoding step's top1-top2 gap was 1.0 or more in bf16 (floor 0.5). Reference recorded with bin/pw record --target gpu, identical in 3 further runs. Provenance of the pins, read before the run: What was read (2026-10-09, public Hugging Face API and raw files, no credentials): commit, file names, sizes and LFS sha256 of the 6 pinned file(s) (model.sha256, Hub oids, verified on every run). Licence: Apache-2.0. Read 2026-10-09 from the Hub without credentials: mistral-community/pixtral-12b@c2756cbb; card license: apache-2.0 | licence also read from mistralai/Pixtral-12B-2409@a5ca2b7a; card license: apache-2.0. Hardware: requires 1 x 40 GiB (single node); weights 23.6 GiB; 23.6/1*1.1 + 4 = 30.0 GiB per GPU; smallest class holding it at 98% usable: 40 GiB; 1 x 40. The hardware margins are formula values; measured memory is stated above. Task: describes scikit-image's public-domain astronaut.png (sha256 pinned, fetched at run time) in one sentence with greedy decoding; text and token ids compared exactly; a decoding step whose top-1 and top-2 logits are within 0.5 (bf16 noise) fails the run. Weights are loaded bf16 with device_map=auto and the run fails if anything would be offloaded to the CPU. bf16 reasoned, not measured. If the model's processor or chat template differs from the generic image+text chat message, the first real run will fail and need a model-specific prompt. Architecture LlavaForConditionalGeneration is listed by the pinned runtime (transformers 5.19.0 image-text-to-text types). Still not verified: other cards (bf16 logits near-tie differently), other transformers versions."
