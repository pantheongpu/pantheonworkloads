name: whisper-cpp-bench-large-v3-turbo
description: "whisper.cpp's own whisper-bench with Whisper large-v3-turbo (whisper.cpp ggml)."
kind: benchmark
runtime: whisper.cpp
targets: [gpu]
timeout_s: 7236
requires:
  gpus: 1
  gpu_memory_gb: 10
  notes: "weights 1.5 GiB; 1.5/1*1.05 + 2 = 3.6 GiB per GPU; smallest class holding it at 98% usable: 10 GiB; 1 x 10"
model:
  id: "ggerganov/whisper.cpp ggml-large-v3-turbo.bin   # OpenAI Whisper large-v3-turbo converted to ggml by whisper.cpp"
  revision: "ggerganov/whisper.cpp HF commit 5359861c739e955e79d9a303bcbc70fb988958b1; ggml-large-v3-turbo.bin sha256 1fc70f774d38eb169993ac391eea357ef47c88757ef72ee5943879b7e8e2bc69 (1624555275 bytes, the Hub's LFS oid); weights of openai/whisper-large-v3-turbo @ 41f01f3fe87f28c78e2fbf8b568835947dd65ed9"
  licence: "MIT"
  source_url: https://huggingface.co/ggerganov/whisper.cpp
notes: "VERIFIED ON NVIDIA A10G (model catalog, stage 2a, 2026-10-10): first real run on NVIDIA A10G (one on-demand g5.2xlarge, 22 GiB, driver 595.91.07, Ubuntu 22.04); the functional twin `whisper-cpp-large-v3-turbo` passed there. Benchmark recorded at 5 repeats: decode_ms_per_run 1.31, encode_ms_per_run 85.45 (median of 5 repeats, bench/whisper-cpp-bench-large-v3-turbo/20261010T092604Z-nvidia-a10g.json). Software: whisper.cpp v1.9.5. Provenance, written from Hub metadata on 2026-10-09 before this run: What was read (2026-10-09, public Hugging Face API and raw files, no credentials): commit, file names, sizes and LFS sha256 of the 1 pinned file(s) (model.sha256, Hub oids, verified on every run). Licence: MIT. Read 2026-10-09 from the Hub without credentials: openai/whisper-large-v3-turbo@41f01f3f; card license: mit | downloaded repository ggerganov/whisper.cpp@5359861c; card license: mit; its card carries a licence agreement text: False. Hardware: requires 1 x 10 GiB (single node); weights 1.5 GiB; 1.5/1*1.05 + 2 = 3.6 GiB per GPU; smallest class holding it at 98% usable: 10 GiB; 1 x 10. These margins were assumptions; this workload ran within them on one 22.5 GiB A10G. Same as whisper-cpp-large-v3 with the large-v3-turbo model (whisper.cpp ggml format, converted by the whisper.cpp project; a pruned large-v3 with 4 decoder layers). Runtime: whisper.cpp tag v1.9.5 built by tools/build-whisper-cpp.sh; model and clip are fetched by tools/whisper-assets.sh and checked against pinned checksums. Task: whisper-bench (encoder on synthetic input plus decoder steps)."
