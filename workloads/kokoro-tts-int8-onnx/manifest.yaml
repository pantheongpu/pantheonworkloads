name: kokoro-tts-int8-onnx
description: Kokoro v0.19 (int8 ONNX) speaks two fixed phoneme strings; the waveform statistics are compared.
kind: functional
runtime: onnxruntime
runtime_version: "onnxruntime 1.30.0 (PyPI; CPU wheel on cpu, onnxruntime-gpu on gpu)"
targets: [cpu, gpu]
compare: tolerance
tolerance: {abs: 0.0, rel: 0.0, fields: {n_samples: {abs: 0.0, rel: 0.015}, rms: {abs: 0.003, rel: 0.0}, centroid_hz: {abs: 150.0, rel: 0.0}, envelope: {abs: 0.03, rel: 0.0}}}
informational: [n_samples_exact]
timeout_s: 1800
model:
  id: hexgrad/Kokoro-82M v0.19 (the "kLegacy" release), int8 ONNX export by k2-fsa/sherpa-onnx (kokoro-int8-en-v0_19.tar.bz2)
  revision: "k2-fsa/sherpa-onnx release tag tts-models (a rolling tag), archive sha256 c9f0dd393615805b0bab050c340834d5e684e732aec91c0e860cd30e982c08bd (files dated 2025-08-10 inside); each file used is pinned by its own sha256 in model.sha256"
  licence: Apache-2.0   # LICENSE inside the archive (the full Apache License 2.0 text, 11358 bytes, no copyright line); the archive's README points to huggingface.co/hexgrad/Kokoro-82M, which could not be read here
  source_url: https://github.com/k2-fsa/sherpa-onnx/releases/tag/tts-models
notes: >
  Nothing is committed: the archive (103 MB) is fetched at run time, the pinned members (model 134 MB,
  voices 5.8 MB, tokens, LICENSE; the espeak-ng data directory is not needed) are extracted into the
  cache and the archive is deleted. Input is not text: two phoneme strings in the style of espeak-ng's
  en-us output, typed by hand in tools/speech_tasks.py (KOKORO_SENTENCES), mapped to token ids through
  the archive's tokens.txt with id 0 at both ends; the style row of speaker 0 ("af") is chosen by length,
  as sherpa-onnx's Kokoro code does. Moonshine tiny transcribes the output back to "The quick brown fox
  jumps over the lazy dog." and "Hello world, this is a test." (a development check, not part of the
  workload). The model's vocoder draws random numbers, so the waveform differs between runs on the same
  machine (max sample difference about 0.05 on a 0.3 peak): the workload therefore compares run-to-run
  stable statistics: sample count (within 1.5 %), RMS (abs 0.003; observed spread
  0.0001), spectral centroid (abs 150 Hz; observed 13 Hz run to run, up to 82 Hz against the reference across CPUs) and the RMS in 100 ms
  windows (abs 0.03). The exact lengths are informational (`n_samples_exact`).
  Evidence (docs/int8-and-nondeterminism.md): the second sentence's length depends on the CPU. 70800 samples (reference 71400, 0.84 % fewer)
  came out of every run on an AMD EPYC 7R32 (AVX2, no VNNI; 10 of 10, CPU provider and CUDA EP alike) and on an Intel Xeon 8375C
  (Ice Lake, AVX512-VNNI; 6 of 6); 71400 on the EPYC with `session.x64quantprecision=1` (tools/ort_tasks.py sets it; PW_ORT_X64QUANT=0
  removes it; 10 of 10), and in the reference (recorded on a host that is not identified). So the cause is not only AVX2 saturation.
  1.5 % is the smallest round value above 0.84 % with a margin. The 100 ms envelope of the second sentence differs from the reference by up to
  0.0224 on the EPYC (0.0200 to 0.0206 in 7-bit mode; the Xeon: 0.0016), so the old bound 0.01 never held on that host; 0.03 is the smallest round value above
  0.0224 with a margin. The model is int8 only: on the gpu target the
  integer ops have no CUDA/ROCm kernel and onnxruntime runs them on its CPU provider inside the same session (the provider check
  still passes), so a GPU benchmark measures a mixed placement. No sim: targets.
