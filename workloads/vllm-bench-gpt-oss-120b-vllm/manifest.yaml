name: vllm-bench-gpt-oss-120b-vllm
description: "vLLM's own throughput benchmark on gpt-oss-120b (vLLM; official MXFP4 weights) (1 x 80 GiB)."
kind: benchmark
runtime: vllm
targets: [gpu]
timeout_s: 8658
requires:
  gpus: 1
  gpu_memory_gb: 80
  notes: "weights 60.8 GiB; (60.8/1 + 6)/0.9 = 74.2 GiB per GPU; smallest class holding it at 98% usable: 80 GiB; 1 x 80"
model:
  id: "openai/gpt-oss-120b (vLLM, tensor parallel 1, as stored; 15 weights file(s))"
  revision: "b5c939de8f754692c1647ca79fbf85e8c1e70f8a (HF commit); the weights files are pinned by sha256 in model.sha256 and verified on every run"
  licence: "Apache-2.0"
  source_url: https://huggingface.co/openai/gpt-oss-120b
notes: "VERIFIED ON NVIDIA RTX PRO 6000 Blackwell Server Edition 96 GB (model catalog, stage 2b batch 1; sm_120): medians of 5 repeats: output_tokens_per_s 2155.27; requests_per_s 16.838; total_tokens_per_s 4310.5 (min to max over the repeats: output_tokens_per_s 2134.68 to 2184.14; requests_per_s 16.677 to 17.064; total_tokens_per_s 4269.4 to 4368.3). Run on one AWS g7e.2xlarge in us-west-2 (nvidia-smi name 'NVIDIA RTX PRO 6000 Blackwell Server Edition', 97887 MiB, 95.6 GiB as torch sees it, sm_120, driver 595.112.07, Ubuntu 22.04 Deep Learning Base OSS Nvidia Driver AMI, 2026-10-30) with vLLM 0.30.0 (torch 2.13.0+cu130). Recorded from a clean checkout at repo commit ad945ba6. Functional twin: vllm-gpt-oss-120b-vllm. vLLM 0.30.0 on sm_120 (torch 2.13.0+cu130, FlashInfer 0.6.18); ninja and nvcc must be on PATH for FlashInfer's JIT (the verified runs had PATH=<venv>/bin:/usr/local/cuda-13.2/bin, CUDA_HOME=/usr/local/cuda-13.2; run.sh now puts the interpreter's directory on PATH). What was read (2026-10-09, public Hugging Face API and raw files, no credentials): commit, file names, sizes and LFS sha256 of the 15 pinned file(s) (model.sha256, Hub oids, verified on every run). Licence: Apache-2.0. Read 2026-10-09 from the Hub without credentials: openai/gpt-oss-120b@b5c939de; card license: apache-2.0; LICENSE begins 'Apache License Version 2.0, January 2004 http://www.apache.org/licenses/ TERMS AND CONDITI'. Hardware: requires 1 x 80 GiB (single node); weights 60.8 GiB; (60.8/1 + 6)/0.9 = 74.2 GiB per GPU; smallest class holding it at 98% usable: 80 GiB; 1 x 80. The hardware margins are formula values; measured memory is stated above. Task: `vllm bench throughput` (vLLM v0.30.0) on the verified local snapshot: random dataset, 64 prompts of 128 input and 128 output tokens, --max-model-len 4096, tensor parallel = requires.gpus; metrics requests_per_s, total_tokens_per_s, output_tokens_per_s. Real GPUs only."
