name: bge-reranker-v2-m3-bench
description: "bge-reranker-v2-m3: throughput and peak GPU memory (retrieval)."
kind: benchmark
runtime: pytorch
targets: [gpu]
timeout_s: 7224
requires:
  gpus: 1
  gpu_memory_gb: 10
  notes: "weights 1.1 GiB; 1.1/1*1.1 + 4 = 5.2 GiB per GPU; smallest class holding it at 98% usable: 10 GiB; 1 x 10"
model:
  id: "BAAI/bge-reranker-v2-m3 (retrieval; 1 pinned weights file(s), as stored)"
  revision: "953dc6f6f85a1b2dbfca4c34a2796e7dde08d41e (HF commit); the weights files are pinned by sha256 in model.sha256 and verified on every run"
  licence: "Apache-2.0"
  source_url: https://huggingface.co/BAAI/bge-reranker-v2-m3
notes: "VERIFIED ON NVIDIA A10G (model catalog, stage 2a, 2026-10-10): first real run on NVIDIA A10G (one on-demand g5.2xlarge, 22 GiB, driver 595.91.07, Ubuntu 22.04); the functional twin `bge-reranker-v2-m3-pytorch` passed there. Benchmark recorded at 5 repeats: forward_passes_per_s 68.74, peak_gpu_memory_gb 1.15 (median of 5 repeats, bench/bge-reranker-v2-m3-bench/20261010T060404Z-nvidia-a10g.json). Software: torch 2.14.1+cu130, torchvision 0.29.1+cu130, transformers 5.19.0, diffusers 0.41.0, numpy 2.5.3. Provenance, written from Hub metadata on 2026-10-09 before this run: What was read (2026-10-09, public Hugging Face API and raw files, no credentials): commit, file names, sizes and LFS sha256 of the 1 pinned file(s) (model.sha256, Hub oids, verified on every run). Licence: Apache-2.0. Read 2026-10-09 from the Hub without credentials: BAAI/bge-reranker-v2-m3@953dc6f6; card license: apache-2.0. Hardware: requires 1 x 10 GiB (single node); weights 1.1 GiB; 1.1/1*1.1 + 4 = 5.2 GiB per GPU; smallest class holding it at 98% usable: 10 GiB; 1 x 10. These margins were assumptions; this workload ran within them on one 22.5 GiB A10G. Task: the four fixed texts of llamacpp-qwen3-embedding-4b (a query about the capital of France and three passages); output = cosine similarities / scores and the passage ranking, head 'seqcls'; the run fails when the Paris passage is not first. Bench mode of the same script: metrics are throughput and peak memory after warm-up; model load excluded. Architecture XLMRobertaForSequenceClassification is listed by the pinned runtime (transformers 5.19.0 model types)."
