name: qwen3-reranker-4b-bench
description: "Qwen3-Reranker-4B: throughput and peak GPU memory (retrieval)."
kind: benchmark
runtime: pytorch
targets: [gpu]
timeout_s: 7378
requires:
  gpus: 1
  gpu_memory_gb: 15
  notes: "weights 7.5 GiB; 7.5/1*1.1 + 4 = 12.2 GiB per GPU; smallest class holding it at 98% usable: 15 GiB; 1 x 15"
model:
  id: "Qwen/Qwen3-Reranker-4B (retrieval; 2 pinned weights file(s), as stored)"
  revision: "22e683669bc0f0bd69640a1354a6d0aebcfeede5 (HF commit); the weights files are pinned by sha256 in model.sha256 and verified on every run"
  licence: "Apache-2.0"
  source_url: https://huggingface.co/Qwen/Qwen3-Reranker-4B
notes: "VERIFIED ON NVIDIA A10G (model catalog, stage 2a, 2026-10-10): first real run on NVIDIA A10G (one on-demand g5.2xlarge, 22 GiB, driver 595.91.07, Ubuntu 22.04); the functional twin `qwen3-reranker-4b-pytorch` passed there. Benchmark recorded at 5 repeats: forward_passes_per_s 12.59, peak_gpu_memory_gb 8.18 (median of 5 repeats, bench/qwen3-reranker-4b-bench/20261010T065312Z-nvidia-a10g.json). Software: torch 2.14.1+cu130, torchvision 0.29.1+cu130, transformers 5.19.0, diffusers 0.41.0, numpy 2.5.3. Changed in this run: the first run failed its own margin check (P(yes) of the two irrelevant passages differs by 7e-5 to 7e-4, which the check, written for logits, called too close); the result is now the top passage only (ranking '1') and the scores, and the margin that is checked is the one between the top passage and the runner-up (0.83 to 0.995 over the three sizes), because noise orders the two irrelevant passages. Provenance, written from Hub metadata on 2026-10-09 before this run: What was read (2026-10-09, public Hugging Face API and raw files, no credentials): commit, file names, sizes and LFS sha256 of the 2 pinned file(s) (model.sha256, Hub oids, verified on every run). Licence: Apache-2.0. Read 2026-10-09 from the Hub without credentials: Qwen/Qwen3-Reranker-4B@22e68366; card license: apache-2.0. Hardware: requires 1 x 15 GiB (single node); weights 7.5 GiB; 7.5/1*1.1 + 4 = 12.2 GiB per GPU; smallest class holding it at 98% usable: 15 GiB; 1 x 15. These margins were assumptions; this workload ran within them on one 22.5 GiB A10G. Task: the four fixed texts of llamacpp-qwen3-embedding-4b (a query about the capital of France and three passages); output = cosine similarities / scores and the passage ranking, head 'qwen3-reranker'; the run fails when the Paris passage is not first. Bench mode of the same script: metrics are throughput and peak memory after warm-up; model load excluded. Architecture Qwen3ForCausalLM is listed by the pinned runtime (transformers 5.19.0 model types)."
