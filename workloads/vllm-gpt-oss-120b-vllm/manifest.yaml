notes: "VERIFIED ON NVIDIA RTX PRO 6000 Blackwell Server Edition 96 GB (model catalog, stage 2b batch 1; sm_120): reference recorded and identical in 3 further runs. Run on one AWS g7e.2xlarge in us-west-2 (nvidia-smi name 'NVIDIA RTX PRO 6000 Blackwell Server Edition', 97887 MiB, 95.6 GiB as torch sees it, sm_120, driver 595.112.07, Ubuntu 22.04 Deep Learning Base OSS Nvidia Driver AMI, 2026-10-30) with vLLM 0.30.0 (torch 2.13.0+cu130). Greedy output ' Paris.\\n\\nGreat! If you have' recorded with bin/pw record --target gpu, then compared exactly in 3 further bin/pw run passes (every one PASS). The twin vllm-bench-gpt-oss-120b-vllm holds the speed. Unverified: other cards and runtime builds. vLLM 0.30.0 runs on sm_120 with its pinned torch 2.13.0+cu130 and FlashInfer 0.6.18 (attention-sink prefill kernel JIT-compiled on first start, a few minutes). The first attempt failed in FlashInfer's JIT with FileNotFoundError 'ninja' (the venv's bin directory was not on PATH); the verified runs had PATH=<venv>/bin:/usr/local/cuda-13.2/bin and CUDA_HOME=/usr/local/cuda-13.2, and run.sh now puts the interpreter's directory on PATH (that run.sh line itself was not re-run). VLLM_USE_FLASHINFER_SAMPLER=0 as in run.sh. Own venv (vllm 0.30.0 only). What was read (2026-10-09, public Hugging Face API and raw files, no credentials): commit, file names, sizes and LFS sha256 of the 15 pinned file(s) (model.sha256, Hub oids, verified on every run). Licence: Apache-2.0. Read 2026-10-09 from the Hub without credentials: openai/gpt-oss-120b@b5c939de; card license: apache-2.0; LICENSE begins 'Apache License Version 2.0, January 2004 http://www.apache.org/licenses/ TERMS AND CONDITI'. Hardware: requires 1 x 80 GiB (single node); weights 60.8 GiB; (60.8/1 + 6)/0.9 = 74.2 GiB per GPU; smallest class holding it at 98% usable: 80 GiB; 1 x 80. The hardware margins are formula values; measured memory is stated above. Task: vLLM v0.30.0 greedy-decodes 8 tokens after \"The capital of France is\" (eager mode, max_model_len 4096, gpu_memory_utilization 0.90, seed 0, temperature 0); output compared exactly once a reference is recorded."
