name: f5-tts-pytorch
description: "F5-TTS (v1 Base) (tts) on a fixed input; the result is compared with a tolerance."
kind: functional
runtime: pytorch
targets: [gpu]
compare: tolerance
tolerance:
  abs: 0.03
  rel: 0.0
  fields:
    duration_s: {abs: 0.05, rel: 0.0}
timeout_s: 3615
restricted: true
requires:
  gpus: 1
  gpu_memory_gb: 10
  notes: "weights 1.3 GiB; 1.3/1*1.1 + 4 = 5.4 GiB per GPU; smallest class holding it at 98% usable: 10 GiB; 1 x 10"
model:
  id: "SWivid/F5-TTS (tts; 1 pinned weights file(s), as stored)"
  revision: "84e5a410d9cead4de2f847e7c9369a6440bdfaca (HF commit); the weights files are pinned by sha256 in model.sha256 and verified on every run"
  licence: "CC-BY-NC-4.0"
  source_url: https://huggingface.co/SWivid/F5-TTS
notes: "DURATION (2026-10-30, A10G): duration_s was reported rounded to 0.5 s (4.41 s of audio gave 4.5), so a different stack could flip it; it is now the duration in seconds to 2 decimals, compared with abs 0.05 (rms keeps abs 0.03). Measured: 5 consecutive runs with seed 0 all 4.41 s (rms 0.202); seeds 1 to 8 (seed is a PW_TTS_SEED knob, default 0) all 4.41 s too, rms 0.189 to 0.22 (seed 5 trips the peak<=1.5 plausibility check at 1.52, not changed); TF32 on: 4.41 s. F5-TTS derives the clip length from the reference clip and the text lengths, not from the sampler, so the worst measured deviation is 0.00 s; 0.05 s is five steps of the 0.01 s reporting resolution (about 1.1 % of the clip), room for a different resampler or ffmpeg build moving the reference length by a few frames. No CPU target exists for this workload. VERIFIED ON NVIDIA A10G (model catalog, stage 2a, 2026-10-10): first real run. Reference recorded with `bin/pw record --target gpu` on NVIDIA A10G (one on-demand g5.2xlarge, 22 GiB, driver 595.91.07, Ubuntu 22.04) and identical in 3 further consecutive runs. Software: torch 2.14.1+cu130, torchvision 0.29.1+cu130, transformers 5.19.0, numpy 2.5.3. Own venv (PW_VENV_NAME=f5): torch 2.14.1 with torchaudio 2.11.0+cu130 (the newest there is; it imported and worked beside torch 2.14.1). Needs the system FFmpeg libraries (torchcodec loads libavutil.so.56: `apt install ffmpeg`, 4.4.2 here); the first run failed without them. The vocabulary is now read from the checkpoint's own directory (identical to the base one, measured). Provenance, written from Hub metadata on 2026-10-09 before this run: What was read (2026-10-09, public Hugging Face API and raw files, no credentials): commit, file names, sizes and LFS sha256 of the 1 pinned file(s) (model.sha256, Hub oids, verified on every run). Licence: CC-BY-NC-4.0. Read 2026-10-09 from the Hub without credentials: SWivid/F5-TTS@84e5a410; card license: cc-by-nc-4.0. RESTRICTED: CC-BY-NC-4.0 is a custom, non-OSI or use-based licence (rule in docs/model-registry.md), so the workload is excluded from default selections (docs/manifest.md); name it to run it, and accept the licence yourself. Hardware: requires 1 x 10 GiB (single node); weights 1.3 GiB; 1.3/1*1.1 + 4 = 5.4 GiB per GPU; smallest class holding it at 98% usable: 10 GiB; 1 x 10. These margins were assumptions; this workload ran within them on one 22.5 GiB A10G. Task: synthesise one fixed sentence; the waveform is checked (finite, 1 s or longer, not silent), output = duration in seconds (2 decimals, abs tolerance 0.05) and the RMS level (abs tolerance 0.03). The generator is sampled, so this is a plausibility check, not a regression test of the audio."
