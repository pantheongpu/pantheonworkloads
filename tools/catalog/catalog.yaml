# The model catalog: one entry per open-weight model this repository tracks, however large.
#
# Only choices are written here. Facts (commit, file sizes, sha256, licence tags, gating, parameter counts,
# architectures) are read from the public Hugging Face API by tools/catalog/fetch_hub.py into hub.json, and
# tools/catalog/generate.py turns the two into workloads/<name>/ directories and docs/model-registry.md.
# Nothing is downloaded, nothing is run: see docs/model-registry.md for what that means.
#
# Fields
#   key        workload name stem
#   family     grouping in the registry
#   title      display name
#   plan       how it would run: llamacpp | llamacpp-embed | vllm | vlm | diffusers | whispercpp | asr | tts | retrieval | vision | timeseries
#   base       the official repository (licence evidence, parameter count, architecture)
#   repo       repository whose files are downloaded (default: base)
#   gguf       llamacpp: candidate GGUF repositories, in order of preference (default: derived from the base name)
#   quant      llamacpp: GGUF quantisation to use (default: Q4_K_M, or Q8_0 for models up to 14B parameters)
#   allow      non-GGUF plans: path regexes of the files to download (default: every weights file and small config)
#   block      a reason: the entry is recorded in the registry but gets no workload
#   spec       plan-specific settings (see the shared modules in workloads/_pytorch and workloads/_shared)
#   note       free text carried into the manifest notes
entries:

